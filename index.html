<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>얼굴 공튀기기</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#bfe6ff;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100vh}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,50,90,.55);color:#fff;text-align:center;padding:16px;overflow:auto}
  #overlay h1{font-size:40px;font-weight:900;text-shadow:0 3px 0 #2b7bb9}
  #overlay .sub{font-size:18px;font-weight:700}
  .guide{background:rgba(255,255,255,.14);border-radius:16px;padding:14px 18px;font-size:15px;line-height:1.75;text-align:left;max-width:380px}
  .guide b{color:#ffe066}
  #overlay button{font:inherit;font-size:20px;font-weight:800;padding:14px 40px;border:0;border-radius:999px;background:#ffcf33;color:#5a3b00;box-shadow:0 5px 0 #c99a00;cursor:pointer;margin-top:4px}
  #overlay button:active{transform:translateY(3px);box-shadow:0 2px 0 #c99a00}
  #mute{position:fixed;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:20px;cursor:pointer;z-index:5}

  #qrBtn{position:fixed;right:64px;bottom:12px;height:44px;padding:0 14px;border-radius:22px;border:0;background:rgba(255,255,255,.9);font:inherit;font-size:15px;font-weight:800;color:#2b5b8a;cursor:pointer;z-index:5}
  #overlay #qrBtn2{background:#fff;color:#2b5b8a;box-shadow:0 5px 0 #9cc3e6;font-size:16px;padding:10px 26px}
  #qrModal{position:fixed;inset:0;z-index:20;background:rgba(10,30,60,.75);display:flex;align-items:center;justify-content:center;padding:16px}
  .qrCard{background:#fff;border-radius:22px;padding:22px;width:100%;max-width:440px;text-align:center;color:#223;max-height:100%;overflow:auto}
  .qrCard h2{font-size:22px;margin-bottom:6px}
  .qrCard .hint{font-size:13px;color:#667;line-height:1.5;margin-bottom:12px}
  #qrBox{display:flex;justify-content:center;align-items:center;min-height:120px;margin:10px auto}
  #qrBox img,#qrBox canvas{width:min(70vw,300px)!important;height:auto!important;image-rendering:pixelated}
  .qrRow{display:flex;gap:6px;margin-top:6px}
  .qrRow input{flex:1;min-width:0;font:inherit;font-size:14px;padding:10px 12px;border:2px solid #cfe0f0;border-radius:12px}
  .qrCard button{font:inherit;font-weight:800;border:0;border-radius:12px;padding:10px 14px;cursor:pointer}
  .qrMake{background:#ffcf33;color:#5a3b00}
  .qrBtns{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .qrBtns button{background:#e8f2fb;color:#2b5b8a}
  #qrMsg{font-size:13px;color:#d33;margin-top:8px;min-height:1em}
  #qrModal.big .qrCard{max-width:none;height:100%;display:flex;flex-direction:column;justify-content:center;border-radius:0}
  #qrModal.big{padding:0}
  #qrModal.big .hint,#qrModal.big .qrRow,#qrModal.big #qrMsg{display:none}
  #qrModal.big #qrBox img,#qrModal.big #qrBox canvas{width:min(85vw,75vh)!important}
  #qrModal.big h2{font-size:clamp(24px,4vw,44px)}
  .hidden{display:none!important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="mute" title="소리 켜기/끄기">🔊</button>
<button id="qrBtn">📱 QR</button>
<div id="qrModal" class="hidden">
  <div class="qrCard">
    <h2>📱 QR 찍고 같이 해요!</h2>
    <div class="hint" id="qrHint">아이들이 휴대폰·태블릿 카메라로 찍으면 바로 게임이 열려요.</div>
    <div id="qrBox"></div>
    <div class="qrRow"><input id="qrUrl" placeholder="게임 주소(https://...) 붙여넣기"><button class="qrMake" id="qrMake">QR 만들기</button></div>
    <div id="qrMsg"></div>
    <div class="qrBtns"><button id="qrBig">🖥️ 크게 보기</button><button id="qrClose">닫기</button></div>
  </div>
</div>
<div id="overlay">
  <h1 id="title">얼굴 공튀기기</h1>
  <div class="sub" id="sub">최고 점수 0</div>
  <div class="guide" id="guide">
    👆 떨어지는 얼굴을 <b>터치</b>해서 튀기기<br>
    🎯 얼굴 <b>정중앙</b>을 치면 PERFECT 보너스<br>
    🔥 헛치지 않고 <b>10콤보</b>면 피버! 점수 2배<br>
    ⭐ 공을 날려 별을 먹으면 +5점<br>
    🐢 슬로모션 · 🎈 공 커짐 · 🛡️ 바닥 방어 · ❤️ 목숨<br>
    💣 폭탄에 공이 닿으면 목숨 -1 (폭탄을 터치하면 제거!)<br>
    ❤️ 목숨 3개 · 레벨이 오를수록 빨라지고 바람이 불어요
  </div>
  <button id="start">시작하기</button>
  <button id="qrBtn2">📱 QR로 친구들과 하기</button>
</div>

/* ---------- 화면 ---------- */
let W, H, groundY;
function resize(){
  const DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0); ctx.lineJoin = 'round';
  groundY = H - 60;
}
addEventListener('resize', resize); resize();

/* ---------- 사운드 ---------- */
let actx = null, muted = false;
function sfx(freq, dur=.12, type='square', vol=.12, slide=0){
  if(muted) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide), t+dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur);
  }catch(e){}
}
const SND = {
  hit: c => sfx(330 + Math.min(c,20)*30, .1, 'square', .1, 200),
  perfect: () => { sfx(880,.08,'triangle',.15); setTimeout(()=>sfx(1320,.12,'triangle',.15),70); },
  star: () => { sfx(1046,.07,'sine',.15); setTimeout(()=>sfx(1568,.1,'sine',.15),60); },
  power: () => [523,659,784,1046].forEach((f,i)=>setTimeout(()=>sfx(f,.1,'triangle',.13),i*60)),
  boom: () => sfx(160,.4,'sawtooth',.2,-120),
  pop: () => sfx(600,.08,'sine',.12,-400),
  lose: () => sfx(400,.35,'sawtooth',.15,-300),
  level: () => [392,523,659,784,1046].forEach((f,i)=>setTimeout(()=>sfx(f,.12,'square',.09),i*80)),
  miss: () => sfx(140,.08,'sine',.08),
  shield: () => sfx(700,.2,'triangle',.15,500),
};
muteBtn.onclick = e => { e.stopPropagation(); muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; };

/* ---------- 상태 ---------- */
let best = 0;
try { best = +localStorage.getItem('faceBounceBest2') || 0; } catch(e){}
subEl.textContent = '최고 점수 ' + best;

const ball = {x:0,y:0,vx:0,vy:0,baseR:60,r:60,rot:0,vr:0,squash:1,hurt:0};
let state, items, bombs, particles, popups, trail, clouds;
let shake = 0, flash = 0, banner = null, playing = false;

function reset(){
  ball.baseR = Math.max(45, Math.min(68, W*0.11)); ball.r = ball.baseR;
  respawnBall(false);
  state = {score:0, hits:0, combo:0, maxCombo:0, lives:3, level:1, fever:false,
           invuln:0, slow:0, big:0, shield:false, itemTimer:2.5, bombTimer:6, wind:0, windT:0, time:0};
  items = []; bombs = []; particles = []; popups = []; trail = [];
}
function respawnBall(blink=true){
  ball.x = W/2; ball.y = H*0.22; ball.vx = (Math.random()-.5)*100; ball.vy = -150;
  ball.rot = 0; ball.vr = 0;
  if(blink && state) state.invuln = 1.5;
}
clouds = Array.from({length:5},(_,i)=>({x:Math.random()*W, y:40+Math.random()*H*.45, s:.6+Math.random()*.7, v:10+Math.random()*20}));

const LEVEL_THEMES = [
  ['#8fd3ff','#e3f5ff'], ['#ffb8d9','#fff0f6'], ['#ffd28a','#fff6e3'],
  ['#b49bff','#efe8ff'], ['#7ee0c3','#e6fff8'], ['#2b3a67','#6b5ea8']
];
const ITEM_TYPES = [
  {k:'star', e:'⭐', w:60}, {k:'slow', e:'🐢', w:10}, {k:'big', e:'🎈', w:10},
  {k:'shield', e:'🛡️', w:10}, {k:'heart', e:'❤️', w:6}
];
function pickItem(){
  let t = Math.random()*ITEM_TYPES.reduce((a,b)=>a+b.w,0);
  for(const it of ITEM_TYPES){ if((t-=it.w)<0) return it; } return ITEM_TYPES[0];
}

/* ---------- 효과 ---------- */
function burst(x,y,n,colors,speed=220,size=5){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = speed*(.4+Math.random()*.8);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.6,max:.6,c:colors[i%colors.length],size});
  }
}
function popup(x,y,text,color='#fff',size=26){ popups.push({x,y,text,color,size,t:.9}); }
function addScore(n,x,y){
  const mult = state.fever ? 2 : 1, pts = n*mult;
  state.score += pts; return pts;
}

/* ---------- 입력 ---------- */
function tap(px,py){
  if(!playing) return;
  // 폭탄 터치 → 제거
  for(const b of bombs){
    if(!b.dead && (px-b.x)**2 + (py-b.y)**2 < (b.r*1.5)**2){
      b.dead = true; SND.pop(); burst(b.x,b.y,14,['#555','#ffcf33','#ff6b3d']);
      const p = addScore(2); popup(b.x,b.y-20,'+'+p+' 해체!','#ffe066'); return;
    }
  }
  const dx = px-ball.x, dy = py-ball.y, d = Math.hypot(dx,dy);
  if(d > ball.r*1.35){
    // 헛침 → 콤보 리셋
    if(state.combo>0){ popup(px,py,'헛침! 콤보 끊김','#ff6b6b',20); }
    if(state.fever) endFever();
    state.combo = 0; SND.miss(); return;
  }
  const perfect = d < ball.r*0.35;
  const power = Math.min(1150, 760 + state.level*35);
  ball.vy = -power * (perfect ? 1.08 : 1);
  ball.vx = perfect ? ball.vx*.3 : -dx/ball.r*430 + (Math.random()-.5)*60;
  ball.vr = -dx/ball.r*12; ball.squash = .72;
  state.hits++; state.combo++; state.maxCombo = Math.max(state.maxCombo, state.combo);
  const comboBonus = Math.floor(state.combo/5);
  let pts = addScore(1 + comboBonus + (perfect?2:0));
  if(perfect){ SND.perfect(); popup(ball.x,ball.y-ball.r-10,'PERFECT! +'+pts,'#ffe066',30); burst(px,py,20,['#ffe066','#fff','#ffb800'],280,6); }
  else { SND.hit(state.combo); popup(ball.x,ball.y-ball.r-10,'+'+pts,'#fff'); burst(px,py,10,['#ffcf33','#ff7aa8','#fff','#7ad0ff']); }
  if(state.combo === 10){ startFever(); }
  // 레벨업
  const newLevel = 1 + Math.floor(state.hits/12);
  if(newLevel > state.level){ state.level = newLevel; SND.level(); banner = {text:'LEVEL '+newLevel, sub: levelSub(newLevel), t:1.8}; }
}
function levelSub(l){
  if(l===2) return '폭탄 등장! 💣';
  if(l===4) return '바람이 불기 시작해요 🌬️';
  return '공이 더 빨라져요!';
}
function startFever(){ state.fever = true; banner = {text:'🔥 FEVER 🔥', sub:'점수 2배!', t:1.5}; SND.power(); }
function endFever(){ state.fever = false; }

function onPointer(e){
  e.preventDefault();
  const pts = e.changedTouches ? [...e.changedTouches] : [e];
  for(const p of pts) tap(p.clientX, p.clientY);
}
cv.addEventListener('mousedown', onPointer);
cv.addEventListener('touchstart', onPointer, {passive:false});

/* ---------- 목숨/게임오버 ---------- */
function loseLife(reason){
  state.lives--; state.combo = 0; endFever(); shake = 14; flash = .35; ball.hurt = .6;
  SND.lose(); popup(W/2, H*.45, reason, '#ff6b6b', 30);
  burst(ball.x, ball.y, 24, ['#ff6b6b','#fff','#ffb3b3'], 300, 6);
  if(state.lives <= 0){ gameOver(); return; }
  respawnBall(true);
}
function gameOver(){
  playing = false;
  const isBest = state.score > best;
  if(isBest){ best = state.score; try{localStorage.setItem('faceBounceBest2', best);}catch(e){} }
  setTimeout(()=>{
    titleEl.textContent = isBest ? '🏆 신기록! ' + state.score + '점' : '게임 오버 · ' + state.score + '점';
    subEl.textContent = '최고 점수 ' + best;
    guideEl.innerHTML = `튀긴 횟수: <b>${state.hits}번</b><br>최대 콤보: <b>${state.maxCombo}</b><br>도달 레벨: <b>${state.level}</b>`;
    startBtn.textContent = '다시 하기';
    overlay.classList.remove('hidden');
  }, 700);
}
startBtn.addEventListener('click', ()=>{ reset(); overlay.classList.add('hidden'); playing = true; SND.level(); });

/* ---------- 업데이트 ---------- */
let last = performance.now();
function update(rdt){
  const dt = rdt * (state.slow > 0 ? .5 : 1);
  state.time += rdt;
  state.invuln = Math.max(0, state.invuln - rdt);
  state.slow = Math.max(0, state.slow - rdt);
  state.big = Math.max(0, state.big - rdt);
  ball.hurt = Math.max(0, ball.hurt - rdt);
  const targetR = ball.baseR * (state.big > 0 ? 1.5 : 1);
  ball.r += (targetR - ball.r) * .12;

  // 바람 (레벨 4+)
  if(state.level >= 4){
    state.windT -= rdt;
    if(state.windT <= 0){ state.windT = 3 + Math.random()*3; state.wind = (Math.random()-.5) * (150 + state.level*40); }
  } else state.wind = 0;

  const gravity = 1450 + (state.level-1)*130;
  ball.vy += gravity*dt; ball.vx += state.wind*dt;
  ball.x += ball.vx*dt; ball.y += ball.vy*dt;
  ball.rot += ball.vr*dt; ball.vr *= .99;
  if(ball.x < ball.r){ ball.x = ball.r; ball.vx = Math.abs(ball.vx)*.8; }
  if(ball.x > W-ball.r){ ball.x = W-ball.r; ball.vx = -Math.abs(ball.vx)*.8; }
  if(ball.y < ball.r){ ball.y = ball.r; ball.vy = Math.abs(ball.vy)*.5; }
  if(ball.y + ball.r >= groundY){
    ball.y = groundY - ball.r;
    if(state.shield){ state.shield = false; ball.vy = -950; SND.shield(); popup(ball.x,groundY-20,'🛡️ 방어!','#7ad0ff',28); burst(ball.x,groundY,20,['#7ad0ff','#fff']); }
    else if(state.invuln > 0){ ball.vy = -900; }
    else { loseLife('쿵! 목숨 -1'); }
  }
  if(state.fever){ trail.push({x:ball.x,y:ball.y,r:ball.r,h:(state.time*400)%360}); if(trail.length>14) trail.shift(); }
  else if(trail.length) trail.shift();

  // 아이템 생성
  state.itemTimer -= dt;
  if(state.itemTimer <= 0){
    state.itemTimer = 2.5 + Math.random()*2;
    const t = pickItem();
    items.push({...t, x:50+Math.random()*(W-100), y:90+Math.random()*(groundY*.55), t:0, life:7});
  }
  for(const it of items){
    it.t += dt; it.life -= dt;
    if(Math.hypot(it.x-ball.x, it.y-ball.y) < ball.r + 22){ collect(it); it.life = 0; }
  }
  items = items.filter(i=>i.life>0);

  // 폭탄 (레벨 2+)
  if(state.level >= 2){
    state.bombTimer -= dt;
    if(state.bombTimer <= 0){
      state.bombTimer = Math.max(2.2, 6.5 - state.level*.6) + Math.random()*2;
      const fromLeft = Math.random() < .5;
      bombs.push({x: fromLeft ? -30 : W+30, y: 100 + Math.random()*(groundY*.5), vx:(fromLeft?1:-1)*(90+state.level*20), r:22, t:0});
    }
  }
  for(const b of bombs){
    b.x += b.vx*dt; b.t += dt; b.y += Math.sin(b.t*3)*0.6;
    if(!b.dead && state.invuln<=0 && Math.hypot(b.x-ball.x,b.y-ball.y) < ball.r + b.r*.8){
      b.dead = true; SND.boom(); burst(b.x,b.y,30,['#ff6b3d','#ffcf33','#555'],350,7);
      loseLife('💥 펑! 목숨 -1');
    }
  }
  bombs = bombs.filter(b=>!b.dead && b.x>-60 && b.x<W+60);

  particles.forEach(p=>{p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.vy+=600*rdt;p.life-=rdt;}); particles = particles.filter(p=>p.life>0);
  popups.forEach(p=>{p.y-=55*rdt;p.t-=rdt;}); popups = popups.filter(p=>p.t>0);
  if(banner){ banner.t -= rdt; if(banner.t<=0) banner = null; }
}
function collect(it){
  burst(it.x,it.y,14,['#ffe066','#fff','#ff9ad5'],220);
  if(it.k==='star'){ const p = addScore(5); SND.star(); popup(it.x,it.y,'⭐ +'+p,'#ffe066'); return; }
  SND.power();
  if(it.k==='slow'){ state.slow = 5; popup(it.x,it.y,'🐢 슬로모션!','#9cf29c'); }
  if(it.k==='big'){ state.big = 8; popup(it.x,it.y,'🎈 얼굴 커짐!','#ff9ad5'); }
  if(it.k==='shield'){ state.shield = true; popup(it.x,it.y,'🛡️ 바닥 방어!','#7ad0ff'); }
  if(it.k==='heart'){ state.lives = Math.min(5, state.lives+1); popup(it.x,it.y,'❤️ 목숨 +1','#ff6b6b'); }
}

/* ---------- 그리기 ---------- */
function draw(){
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake); shake*=.85; if(shake<.5) shake=0; }
  const theme = LEVEL_THEMES[Math.min(LEVEL_THEMES.length-1, (state?state.level:1)-1)];
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,theme[0]); g.addColorStop(1,theme[1]);
  ctx.fillStyle = g; ctx.fillRect(-20,-20,W+40,H+40);
  if(state && state.fever){ ctx.fillStyle = `hsla(${(state.time*200)%360},90%,60%,.15)`; ctx.fillRect(-20,-20,W+40,H+40); }

  // 구름
  ctx.fillStyle = 'rgba(255,255,255,.75)';
  for(const c of clouds){
    c.x += (c.v + (state?state.wind*.15:0))/60; if(c.x > W+120) c.x = -120; if(c.x < -140) c.x = W+100;
    ctx.save(); ctx.translate(c.x,c.y); ctx.scale(c.s,c.s);
    ctx.beginPath(); ctx.arc(0,0,28,0,7); ctx.arc(30,-12,34,0,7); ctx.arc(62,0,26,0,7); ctx.fill(); ctx.restore();
  }
  // 잔디
  ctx.fillStyle = '#6cc04a'; ctx.fillRect(-20,groundY,W+40,H-groundY+20);
  ctx.fillStyle = '#58a83a'; ctx.fillRect(-20,groundY,W+40,8);
  if(state && state.shield){ ctx.fillStyle = 'rgba(122,208,255,.55)'; ctx.fillRect(-20,groundY-6,W+40,8); }

  if(!state){ ctx.restore(); return; }

  // 아이템
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(const it of items){
    const bob = Math.sin(it.t*4)*6, blink = it.life < 1.5 && Math.floor(it.life*8)%2;
    if(blink) continue;
    ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(it.x,it.y+bob,24,0,7); ctx.fill();
    ctx.font = '30px sans-serif'; ctx.fillText(it.e, it.x, it.y+bob+1);
  }
  // 폭탄
  for(const b of bombs){
    ctx.font = (b.r*2)+'px sans-serif'; ctx.fillText('💣', b.x, b.y);
    if(Math.floor(b.t*6)%2){ ctx.fillStyle='#ffcf33'; ctx.beginPath(); ctx.arc(b.x+b.r*.55,b.y-b.r*.8,4,0,7); ctx.fill(); }
  }

  // 그림자
  const hgt = Math.max(0, groundY-(ball.y+ball.r)), sh = Math.max(.25, 1-hgt/H);
  ctx.fillStyle = 'rgba(0,0,0,'+(.25*sh)+')';
  ctx.beginPath(); ctx.ellipse(ball.x, groundY+4, ball.r*sh, ball.r*.18*sh, 0, 0, 7); ctx.fill();

  // 피버 잔상
  trail.forEach((t,i)=>{ ctx.globalAlpha = i/trail.length*.5; ctx.fillStyle=`hsl(${(t.h+i*20)%360},90%,60%)`; ctx.beginPath(); ctx.arc(t.x,t.y,t.r*(.5+i/trail.length*.5),0,7); ctx.fill(); });
  ctx.globalAlpha = 1;

  // 얼굴 공
  const blinkHide = state.invuln > 0 && Math.floor(state.invuln*10)%2;
  if(!blinkHide){
    ctx.save(); ctx.translate(ball.x, ball.y); ctx.rotate(ball.rot);
    ctx.scale(1/Math.sqrt(ball.squash), ball.squash);
    if(state.fever){ ctx.shadowColor = `hsl(${(state.time*400)%360},100%,60%)`; ctx.shadowBlur = 30; }
    ctx.beginPath(); ctx.arc(0,0,ball.r,0,7); ctx.fillStyle='#fff'; ctx.fill(); ctx.shadowBlur = 0;
    if(face.complete) ctx.drawImage(face, -ball.r, -ball.r, ball.r*2, ball.r*2);
    if(ball.hurt > 0){ ctx.fillStyle = `rgba(255,60,60,${ball.hurt*.7})`; ctx.beginPath(); ctx.arc(0,0,ball.r,0,7); ctx.fill(); }
    ctx.lineWidth = 4; ctx.strokeStyle = state.fever ? '#ffe066' : '#fff'; ctx.stroke();
    ctx.restore();
  }

  // 파티클, 팝업
  particles.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life/p.max); ctx.fillStyle=p.c; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill(); });
  ctx.globalAlpha = 1;
  popups.forEach(p=>{ ctx.globalAlpha=Math.min(1,p.t*2); ctx.font=`900 ${p.size}px sans-serif`; ctx.lineWidth=5; ctx.strokeStyle='rgba(30,60,110,.9)'; ctx.strokeText(p.text,p.x,p.y); ctx.fillStyle=p.color; ctx.fillText(p.text,p.x,p.y); });
  ctx.globalAlpha = 1;

  if(flash>0){ ctx.fillStyle=`rgba(255,60,60,${flash})`; ctx.fillRect(-20,-20,W+40,H+40); flash = Math.max(0, flash-.02); }
  ctx.restore();
  drawHUD();
}
function outlined(text,x,y,size,fill,align='center'){
  ctx.font = `900 ${size}px sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3,size/7); ctx.strokeStyle = 'rgba(30,70,120,.9)'; ctx.strokeText(text,x,y);
  ctx.fillStyle = fill; ctx.fillText(text,x,y);
}
function drawHUD(){
  outlined(state.score, W/2, 50, 56, '#fff');
  outlined('LV.'+state.level, 16, 28, 20, '#ffe066', 'left');
  ctx.font = '22px sans-serif'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('❤️'.repeat(state.lives) + '🤍'.repeat(Math.max(0,3-state.lives)), W-14, 28);
  if(state.combo >= 2){
    const s = 22 + Math.min(state.combo,30)*.5;
    outlined(state.combo + ' COMBO' + (state.fever?' 🔥x2':''), W/2, 95, s, state.fever ? `hsl(${(state.time*300)%360},100%,70%)` : '#ffe066');
  }
  // 파워업 표시
  let y = 60; ctx.textAlign = 'left';
  const buffs = [];
  if(state.slow>0) buffs.push(['🐢', state.slow, 5]);
  if(state.big>0) buffs.push(['🎈', state.big, 8]);
  if(state.shield) buffs.push(['🛡️', 1, 1]);
  for(const [e,t,m] of buffs){
    ctx.font='20px sans-serif'; ctx.fillText(e, 14, y);
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(42,y-4,60,8);
    ctx.fillStyle='#ffe066'; ctx.fillRect(42,y-4,60*(t/m),8);
    y += 30;
  }
  if(state.wind){
    const dir = state.wind > 0 ? '→' : '←';
    outlined('🌬️ ' + dir.repeat(1+Math.min(2,Math.floor(Math.abs(state.wind)/150))), W-16, 62, 18, '#fff', 'right');
  }
  if(banner){
    const a = Math.min(1, banner.t*2), sc = 1 + Math.max(0, banner.t-1.3)*1.2;
    ctx.save(); ctx.globalAlpha = a; ctx.translate(W/2, H*.38); ctx.scale(sc,sc);
    outlined(banner.text, 0, 0, 46, '#ffe066'); outlined(banner.sub, 0, 44, 20, '#fff');
    ctx.restore();
  }
}

function loop(now){
  const rdt = Math.min(.033, (now-last)/1000); last = now;
  if(playing && qrModal.classList.contains('hidden')) update(rdt);
  else if(state){ particles.forEach(p=>{p.x+=p.vx*rdt;p.y+=p.vy*rdt;p.life-=rdt;}); particles=particles.filter(p=>p.life>0); }
  ball.squash += (1-ball.squash)*.2;
  draw(); requestAnimationFrame(loop);
}

/* ---------- QR 코드 ---------- */
const qrModal = document.getElementById('qrModal'), qrBox = document.getElementById('qrBox'),
      qrUrl = document.getElementById('qrUrl'), qrMsg = document.getElementById('qrMsg'), qrHint = document.getElementById('qrHint');
const isWeb = /^https?:$/.test(location.protocol);
let savedUrl = '';
try { savedUrl = localStorage.getItem('faceBounceUrl') || ''; } catch(e){}
qrUrl.value = savedUrl || (isWeb ? location.href.split('#')[0] : '');
if(!isWeb && !savedUrl) qrHint.innerHTML = '지금은 컴퓨터에 저장된 파일이라 주소가 없어요.<br>이 파일을 인터넷에 올린 <b>링크를 붙여넣고</b> QR 만들기를 누르세요.';
/* 내장 QR 코드 생성기 (바이트 모드, 오류정정 M) — Nayuki QR 알고리즘 기반 축약판 */
const MiniQR = (()=>{
  const ECC = [-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK = [-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const rawMods = v => { let r=(16*v+128)*v+64; if(v>=2){const n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if(v>=7) r-=36;} return r; };
  const dataCw = v => Math.floor(rawMods(v)/8) - ECC[v]*BLK[v];
  const mul = (x,y)=>{ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z; };
  function rsDiv(deg){ const r=new Array(deg).fill(0); r[deg-1]=1; let root=1;
    for(let i=0;i<deg;i++){ for(let j=0;j<r.length;j++){ r[j]=mul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; } root=mul(root,2); } return r; }
  function rsRem(data,div){ const r=div.map(()=>0);
    for(const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>r[i]^=mul(c,f)); } return r; }

  function encode(text){
    const bytes = Array.from(new TextEncoder().encode(text));
    let v=1; for(;v<=40;v++){ const cc = v<10?8:16; if(4+cc+bytes.length*8 <= dataCw(v)*8) break; }
    if(v>40) throw new Error('too long');
    const bits=[]; const put=(val,n)=>{ for(let i=n-1;i>=0;i--) bits.push((val>>>i)&1); };
    put(4,4); put(bytes.length, v<10?8:16); bytes.forEach(b=>put(b,8));
    const cap=dataCw(v)*8; put(0, Math.min(4,cap-bits.length)); put(0,(8-bits.length%8)%8);
    for(let p=0xEC; bits.length<cap; p^=0xEC^0x11) put(p,8);
    const data=[]; for(let i=0;i<bits.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bits[i+j]; data.push(b); }
    // 블록 나누기 + RS
    const nb=BLK[v], ecl=ECC[v], raw=Math.floor(rawMods(v)/8), nShort=nb-raw%nb, shortLen=Math.floor(raw/nb);
    const div=rsDiv(ecl), blocks=[];
    for(let i=0,k=0;i<nb;i++){ const dat=data.slice(k,k+shortLen-ecl+(i<nShort?0:1)); k+=dat.length;
      const e=rsRem(dat,div); if(i<nShort) dat.push(0); blocks.push(dat.concat(e)); }
    const cw=[]; for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==shortLen-ecl||j>=nShort) cw.push(b[i]); });

    const size=v*4+17, M=[...Array(size)].map(()=>Array(size).fill(false)), F=[...Array(size)].map(()=>Array(size).fill(false));
    const set=(x,y,d)=>{ M[y][x]=d; F[y][x]=true; };
    for(let i=0;i<size;i++){ set(6,i,i%2==0); set(i,6,i%2==0); }
    const finder=(x,y)=>{ for(let dy=-4;dy<=4;dy++) for(let dx=-4;dx<=4;dx++){ const d=Math.max(Math.abs(dx),Math.abs(dy)), xx=x+dx, yy=y+dy;
      if(xx>=0&&xx<size&&yy>=0&&yy<size) set(xx,yy,d!==2&&d!==4); } };
    finder(3,3); finder(size-4,3); finder(3,size-4);
    // 정렬 패턴
    const align = v===1?[]:(()=>{ const n=Math.floor(v/7)+2, step=(v===32)?26:Math.ceil((v*4+4)/(n*2-2))*2, r=[6];
      for(let pos=size-7; r.length<n; pos-=step) r.splice(1,0,pos); return r; })();
    align.forEach((a,i)=>align.forEach((b,j)=>{ if((i===0&&j===0)||(i===0&&j===align.length-1)||(i===align.length-1&&j===0)) return;
      for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++) set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1); }));
    const drawFormat=(mask)=>{ const d=(0<<3)|mask; let r=d; for(let i=0;i<10;i++) r=(r<<1)^((r>>>9)*0x537);
      const b=((d<<10)|r)^0x5412, bit=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++) set(8,i,bit(i)); set(8,7,bit(6)); set(8,8,bit(7)); set(7,8,bit(8));
      for(let i=9;i<15;i++) set(14-i,8,bit(i));
      for(let i=0;i<8;i++) set(size-1-i,8,bit(i)); for(let i=8;i<15;i++) set(8,size-15+i,bit(i)); set(8,size-8,true); };
    drawFormat(0);
    if(v>=7){ let r=v; for(let i=0;i<12;i++) r=(r<<1)^((r>>>11)*0x1F25); const b=(v<<12)|r;
      for(let i=0;i<18;i++){ const bt=((b>>>i)&1)!==0, a=size-11+i%3, c=Math.floor(i/3); set(a,c,bt); set(c,a,bt); } }
    // 데이터 배치
    let i=0;
    for(let right=size-1;right>=1;right-=2){ if(right===6) right=5;
      for(let vert=0;vert<size;vert++) for(let j=0;j<2;j++){ const x=right-j, up=((right+1)&2)===0, y=up?size-1-vert:vert;
        if(!F[y][x] && i<cw.length*8){ M[y][x]=((cw[i>>>3]>>>(7-(i&7)))&1)!==0; i++; } } }
    const maskFn=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,
      (x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
    const applyMask=m=>{ for(let y=0;y<size;y++) for(let x=0;x<size;x++) if(!F[y][x]&&maskFn[m](x,y)) M[y][x]=!M[y][x]; };
    const penalty=()=>{ let p=0;
      const runs=get=>{ for(let a=0;a<size;a++){ let run=1; for(let b=1;b<=size;b++){ if(b<size&&get(a,b)===get(a,b-1)) run++; else { if(run>=5) p+=run-2; run=1; } } } };
      runs((a,b)=>M[a][b]); runs((a,b)=>M[b][a]);
      for(let y=0;y<size-1;y++) for(let x=0;x<size-1;x++){ const c=M[y][x]; if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1]) p+=3; }
      const pat=[1,0,1,1,1,0,1];
      const finderLike=get=>{ for(let a=0;a<size;a++) for(let b=0;b+7<=size;b++){ if(!pat.every((q,k)=>get(a,b+k)===!!q)) continue;
        const lw=(s,e)=>{ for(let k=s;k<e;k++) if(k>=0&&k<size&&get(a,k)) return false; return true; };
        if(lw(b-4,b)) p+=40; if(lw(b+7,b+11)) p+=40; } };
      finderLike((a,b)=>M[a][b]); finderLike((a,b)=>M[b][a]);
      let dark=0; M.forEach(r=>r.forEach(c=>dark+=c)); const t=size*size; p+=Math.ceil(Math.abs(dark*20-t*10)/t-1)*10; return p; };
    let bestM=0, bestP=Infinity;
    for(let m=0;m<8;m++){ applyMask(m); drawFormat(m); const p=penalty(); if(p<bestP){bestP=p;bestM=m;} applyMask(m); }
    applyMask(bestM); drawFormat(bestM);
    return M;
  }
  function toCanvas(text, px=512){
    const M=encode(text), n=M.length, q=4, s=Math.floor(px/(n+q*2));
    const c=document.createElement('canvas'); c.width=c.height=s*(n+q*2);
    const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.fillStyle='#000';
    for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(M[y][x]) g.fillRect((x+q)*s,(y+q)*s,s,s);
    return c;
  }
  return {encode, toCanvas};
})();

function makeQR(){
  const url = qrUrl.value.trim();
  qrMsg.textContent = ''; qrBox.innerHTML = '';
  if(!url){ qrBox.innerHTML = '<div style="color:#99a;font-size:14px">링크를 넣으면 여기에 QR이 나와요</div>'; return; }
  if(!/^https?:\/\//i.test(url)){ qrMsg.textContent = 'https:// 로 시작하는 인터넷 주소를 넣어 주세요.'; return; }
  try { localStorage.setItem('faceBounceUrl', url); } catch(e){}
  try { qrBox.appendChild(MiniQR.toCanvas(url, 600)); }
  catch(e){ qrMsg.textContent = '주소가 너무 길어요. 짧은 링크로 바꿔 주세요.'; }
}
function openQR(e){ if(e) e.stopPropagation(); qrModal.classList.remove('hidden','big'); makeQR(); }
document.getElementById('qrBtn').onclick = openQR;
document.getElementById('qrBtn2').onclick = openQR;
document.getElementById('qrMake').onclick = makeQR;
qrUrl.addEventListener('keydown', e=>{ if(e.key==='Enter') makeQR(); });
document.getElementById('qrBig').onclick = ()=>{ qrModal.classList.toggle('big'); document.getElementById('qrBig').textContent = qrModal.classList.contains('big') ? '↩ 작게 보기' : '🖥️ 크게 보기'; };
document.getElementById('qrClose').onclick = ()=>{ qrModal.classList.add('hidden'); qrModal.classList.remove('big'); document.getElementById('qrBig').textContent='🖥️ 크게 보기'; };
// 게임 중 QR 열면 일시정지
reset(); requestAnimationFrame(loop);
</script>
