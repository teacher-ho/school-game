<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>우리 반 게시판</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#3b2a10;--soft:#8a7650}
  html,body{min-height:100%}
  body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#fff7e0;overflow-x:hidden}
  #bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(circle at 20% 0%,#ffe8a3 0,transparent 45%),radial-gradient(circle at 100% 30%,#ffd6e0 0,transparent 40%),radial-gradient(circle at 0% 100%,#d0ebff 0,transparent 40%),#fff7e0}
  #bg span{position:absolute;bottom:-60px;font-size:30px;opacity:.35;animation:floatUp linear infinite}
  @keyframes floatUp{to{transform:translateY(-120vh) rotate(360deg)}}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,textarea{font-family:inherit}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,247,224,.92);backdrop-filter:blur(6px);border-bottom:3px solid #f3d27a}
  header h1{font-size:clamp(20px,4.5vw,30px);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header h1 .w{display:inline-block;animation:wig 2.5s ease-in-out infinite}
  @keyframes wig{0%,100%{transform:rotate(0)}10%{transform:rotate(-15deg)}20%{transform:rotate(12deg)}30%{transform:rotate(0)}}
  .ib{border:0;border-radius:14px;height:42px;padding:0 12px;font-size:16px;font-weight:900;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  #net{font-size:13px;color:var(--soft);white-space:nowrap}
  #net i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#adb5bd;margin-right:4px;vertical-align:-1px}
  #net.on i{background:#40c057;box-shadow:0 0 0 3px rgba(64,192,87,.25)}
  #teach.on{background:#4dabf7;color:#fff}
  main{padding:14px;max-width:1300px;margin:0 auto 90px}
  /* 오늘의 질문 */
  #q{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#845ef7,#f06595);color:#fff;border-radius:22px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.12);margin-bottom:14px}
  #q .qe{font-size:42px;animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-5px) rotate(6deg)}}
  #q .qt{flex:1;font-size:clamp(17px,3.6vw,23px);line-height:1.35}
  #q .qt small{display:block;font-size:13px;opacity:.85}
  #q button{border:0;border-radius:14px;background:#fff;color:#862e9c;font-weight:900;font-size:16px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.15);white-space:nowrap}
  /* 베스트 */
  #best{margin-bottom:14px}
  #best h3{font-size:22px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  #best h3 small{font-size:13px;color:var(--soft)}
  #bestRow{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px}
  .bc{flex:0 0 auto;width:220px;border-radius:20px;padding:10px 12px;position:relative;border:4px solid #fcc419;box-shadow:0 6px 0 #f59f00,0 0 24px rgba(252,196,25,.5);cursor:pointer;animation:shine 2.4s ease-in-out infinite}
  @keyframes shine{50%{box-shadow:0 6px 0 #f59f00,0 0 34px rgba(252,196,25,.9)}}
  .bc .rk{position:absolute;left:-8px;top:-12px;font-size:34px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
  .bc .bn{font-size:15px;margin-left:22px}
  .bc .bx{font-size:16px;margin-top:6px;max-height:3.2em;overflow:hidden;line-height:1.6}
  .bc .bs{font-size:40px;text-align:center}
  .bc .bi{width:100%;border-radius:10px;margin-top:4px;max-height:90px;object-fit:cover}
  .bc .bsc{margin-top:6px;font-size:14px;font-weight:900;color:#e8590c}
  /* 탭 */
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .tabs button{border:0;border-radius:999px;padding:8px 14px;font-size:16px;font-weight:900;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.1)}
  .tabs button.on{background:#ffd23f}
  /* 카드 */
  #wall{columns:270px;column-gap:16px}
  .card{break-inside:avoid;margin:10px 0 18px;border-radius:6px 6px 22px 22px;padding:16px 14px 10px;box-shadow:0 6px 0 rgba(0,0,0,.08),0 10px 22px rgba(0,0,0,.07);position:relative;animation:pop .5s;transform:rotate(var(--tilt,0deg));transition:transform .2s}
  .card:hover{transform:rotate(0) scale(1.02)}
  .card::before{content:'';position:absolute;left:50%;top:-10px;width:70px;height:22px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.1);border-radius:3px}
  .card.best{box-shadow:0 0 0 4px #fcc419,0 6px 0 #f59f00,0 10px 26px rgba(252,196,25,.45)}
  .card.spot{animation:spot 1.2s ease-in-out 2}
  @keyframes spot{50%{transform:scale(1.07) rotate(0);box-shadow:0 0 0 8px #ff6b6b,0 0 40px rgba(255,107,107,.6)}}
  @keyframes pop{0%{transform:scale(.6) rotate(-10deg);opacity:0}70%{transform:scale(1.05)}100%{opacity:1}}
  .card .who{display:flex;align-items:center;gap:8px;font-size:17px}
  .card .av{font-size:30px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.75);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .card .tm{font-size:12px;color:rgba(0,0,0,.45);display:block}
  .card .badge{margin-left:auto;font-size:12px;font-weight:900;background:#fff;border-radius:999px;padding:3px 8px;color:#e8590c;white-space:nowrap}
  .card .qa{font-size:13px;background:rgba(132,94,247,.15);color:#6741d9;border-radius:10px;padding:4px 8px;margin-top:8px;display:inline-block}
  .card .tx{font-size:20px;line-height:1.5;margin:8px 0 4px;white-space:pre-wrap;word-break:break-word}
  .card .tx.big{font-size:28px;text-align:center}
  .card .st{font-size:64px;text-align:center;line-height:1.15;margin:4px 0;animation:bob 2.4s ease-in-out infinite}
  .card .pic{width:100%;border-radius:14px;background:#fff;margin:6px 0;display:block}
  .card .rx{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .card .rx button{border:0;border-radius:999px;background:rgba(255,255,255,.75);padding:3px 9px;font-size:16px;font-weight:900;transition:transform .1s}
  .card .rx button:active{transform:scale(1.3)}
  .card .rx button.me{background:#fff;box-shadow:0 0 0 2px #f08c00}
  .card .del{position:absolute;right:8px;top:8px;border:0;background:rgba(255,255,255,.8);border-radius:10px;font-size:15px;padding:3px 7px;z-index:2}
  .empty{text-align:center;padding:50px 10px;color:var(--soft);font-size:20px;line-height:1.7}
  #fabs{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;gap:10px;align-items:flex-end}
  #fab{border:0;border-radius:999px;padding:16px 24px;font-size:22px;font-weight:900;background:#ffd23f;box-shadow:0 6px 0 #e0a800,0 10px 24px rgba(0,0,0,.2);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.06)}}
  #rand{border:0;border-radius:50%;width:56px;height:56px;font-size:26px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
  .ov{position:fixed;inset:0;z-index:20;background:rgba(40,25,5,.45);display:flex;align-items:center;justify-content:center;padding:12px}
  .pop{background:#fff;border-radius:24px;padding:16px;width:min(560px,100%);max-height:94vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.12)}
  .pop h2{text-align:center;font-size:24px;margin-bottom:8px}
  .lbl{font-weight:900;margin:10px 0 4px;font-size:16px}
  .grid{display:flex;flex-wrap:wrap;gap:6px}
  .grid button{border:3px solid transparent;background:#f8f9fa;border-radius:14px;width:46px;height:46px;font-size:26px}
  .grid button.on{border-color:#ffd23f;background:#fff3bf}
  .cols button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dee2e6}
  .cols button.on{box-shadow:0 0 0 4px var(--ink)}
  #nm{font-size:20px;border:3px solid #ffd23f;border-radius:14px;padding:6px 10px;width:100%}
  #tx{font-size:20px;border:3px solid #dee2e6;border-radius:14px;padding:8px 10px;width:100%;height:96px;resize:none}
  .cnt{text-align:right;font-size:12px;color:var(--soft)}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .btn{border:0;border-radius:14px;padding:11px 18px;font-size:18px;font-weight:900;background:#e9ecef;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .btn.y{background:#ffd23f}.btn.r{background:#ff6b6b;color:#fff}.btn.b{background:#4dabf7;color:#fff}.btn.p{background:#845ef7;color:#fff}
  .btn:disabled{opacity:.45}
  .msg{text-align:center;color:#e03131;font-size:14px;min-height:18px;margin-top:6px}
  .qbox{background:#f3f0ff;color:#6741d9;border-radius:12px;padding:8px 10px;font-size:15px;margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .qbox button{border:0;background:#fff;border-radius:10px;padding:3px 8px;font-size:13px}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:rgba(59,42,16,.92);color:#fff;padding:8px 18px;border-radius:999px;font-size:16px;pointer-events:none;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
  #toast:empty{display:none}
  .pin{font-size:30px;width:170px;text-align:center;letter-spacing:10px;border:3px solid #4dabf7;border-radius:14px;padding:6px;display:block;margin:6px auto}
  .fx{position:fixed;z-index:40;pointer-events:none;font-size:28px;animation:fxUp 1.1s ease-out forwards}
  @keyframes fxUp{0%{transform:translate(0,0) scale(.6);opacity:1}100%{transform:translate(var(--dx),-130px) scale(1.4);opacity:0}}
  .conf{position:fixed;top:-20px;z-index:41;pointer-events:none;font-size:24px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  /* 그림판 */
  #pad{width:100%;aspect-ratio:3/2;border:3px dashed #dee2e6;border-radius:14px;background:#fff;touch-action:none;display:block}
  .tools{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
  .tools .pc{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dee2e6}
  .tools .pc.on{box-shadow:0 0 0 3px var(--ink)}
  .tools .tb{border:0;border-radius:10px;background:#f1f3f5;padding:5px 9px;font-size:14px;font-weight:900}
  .tools .tb.on{background:#ffd23f}
  /* 쪽지 */
  #mail{position:relative;background:#fff0f6}
  #mail b{position:absolute;top:-7px;right:-7px;background:#fa5252;color:#fff;font-size:12px;min-width:21px;height:21px;border-radius:11px;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid #fff;animation:jig 1s ease-in-out infinite}
  #mail b.on{display:flex}
  #mail.ring{animation:wig 1.2s ease-in-out 3}
  @keyframes jig{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
  .mtop{display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;color:var(--soft);font-size:14px;margin-bottom:6px}
  .mtop button{border:0;background:#f1f3f5;border-radius:10px;padding:4px 10px;font-weight:900;font-size:13px}
  .mtabs{display:flex;gap:6px;margin:6px 0 8px;flex-wrap:wrap;justify-content:center}
  .mtabs button{border:0;border-radius:999px;padding:7px 13px;font-weight:900;background:#f1f3f5;font-size:15px}
  .mtabs button.on{background:#ffd23f}
  .mlist{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding:4px 2px}
  .mi{border-radius:16px;padding:10px 12px;background:#fff8e1;border:2px solid #ffe8a3}
  .mi.out{background:#e7f5ff;border-color:#a5d8ff}
  .mi.unread{border-color:#ff8787;box-shadow:0 0 0 3px #ffe3e3;animation:pop .4s}
  .mi .mh{display:flex;gap:6px;align-items:center;font-weight:900;font-size:15px}
  .mi .mh .tm{font-weight:400;color:var(--soft);font-size:12px;margin-left:auto;white-space:nowrap}
  .mi .mh .nw{background:#fa5252;color:#fff;border-radius:8px;font-size:11px;padding:1px 6px}
  .mi .ms{font-size:42px;line-height:1.1;margin-top:4px}
  .mi .mx{font-size:18px;margin:4px 0;word-break:break-all;white-space:pre-wrap}
  .mi .ma{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:13px;color:var(--soft);margin-top:4px}
  .mi .ma button{border:0;border-radius:10px;padding:5px 11px;font-weight:900;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.1);font-size:14px}
  .mempty{text-align:center;color:var(--soft);padding:26px 0;font-size:16px}
  .wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
  .wg button{border:3px solid transparent;border-radius:12px;padding:9px 4px;font-weight:900;font-size:16px;background:#f1f3f5}
  .wg button.on{border-color:#ffd23f;background:#fff3bf}
  #mt{font-size:19px;border:3px solid #dee2e6;border-radius:14px;padding:8px 10px;width:100%;height:80px;resize:none}
  #wnm{font-size:18px;border:3px solid #dee2e6;border-radius:14px;padding:6px 10px;width:100%}
  .fly{position:fixed;z-index:45;font-size:60px;pointer-events:none;animation:fly 1.1s ease-in forwards}
  @keyframes fly{0%{transform:translate(-50%,-50%) scale(.6) rotate(0)}30%{transform:translate(-50%,-70%) scale(1.2) rotate(-10deg)}100%{transform:translate(40vw,-60vh) scale(.4) rotate(25deg);opacity:0}}
  #mpop{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:35;background:#fff;border:4px solid #f783ac;border-radius:24px;padding:14px 18px;width:min(360px,92vw);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:mpIn .6s cubic-bezier(.2,1.6,.4,1)}
  #mpop .me{font-size:64px;line-height:1;animation:env 1s ease-in-out infinite}
  #mpop .mt2{font-size:20px;margin-top:4px;line-height:1.35}
  #mpop .mp{margin-top:6px;background:#fff0f6;border-radius:12px;padding:6px 10px;font-size:16px;word-break:break-all}
  @keyframes mpIn{0%{transform:translate(-50%,140%) scale(.6)}100%{transform:translate(-50%,0) scale(1)}}
  @keyframes env{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(12deg) scale(1.1)}}
  /* 댓글 */
  .cmt{margin-top:8px;border-top:2px dashed rgba(0,0,0,.12);padding-top:6px}
  .cmt .cl{font-size:15px;padding:3px 0;display:flex;gap:5px;align-items:flex-start;word-break:break-all;line-height:1.35}
  .cmt .cl b{white-space:nowrap}
  .cmt .cl .cd{border:0;background:none;font-size:12px;opacity:.55;margin-left:auto;padding:0 2px}
  .cmt .cf{display:flex;gap:5px;margin-top:5px}
  .cmt .cf input{flex:1;min-width:0;border:2px solid rgba(0,0,0,.15);border-radius:10px;padding:6px 8px;font-size:15px;background:#fff}
  .cmt .cf button{border:0;border-radius:10px;background:#4dabf7;color:#fff;font-weight:900;padding:6px 11px;font-size:14px}
  .cmt .none{font-size:13px;color:var(--soft)}
  @media (max-width:520px){ #netT{display:none} header .ib{padding:0 9px} #fab{padding:14px 18px;font-size:19px} .bc{width:180px} }
</style>
</head>
<body>
<div id="bg"></div>
<header>
  <a class="ib" href="index.html">🏠</a>
  <h1><span class="w">📌</span> 우리 반 게시판</h1>
  <span id="net"><i></i><span id="netT">연결 중…</span></span>
  <button class="ib" id="mail" title="쪽지함">💌<b id="mailN"></b></button>
  <button class="ib" id="mute" title="소리">🔊</button>
  <button class="ib" id="teach" title="선생님">👩‍🏫</button>
</header>
<main>
  <div id="q"><div class="qe" id="qE">💭</div><div class="qt"><small>오늘의 질문</small><span id="qT"></span></div><button id="qGo">✏️ 대답하기</button></div>
  <div id="best" class="hidden"><h3>🏆 베스트 게시물 <small>반응을 많이 받은 글이에요!</small></h3><div id="bestRow"></div></div>
  <div class="tabs" id="tabs"><button data-f="all" class="on">📋 전체</button><button data-f="best">🏆 베스트</button><button data-f="q">💭 오늘의 질문</button><button data-f="pic">🖍️ 그림</button><button data-f="me">🙋 내 글</button></div>
  <div id="wall"></div>
  <div class="empty" id="empty">아직 글이 없어요 🌱<br>아래 <b>✏️ 글쓰기</b>를 눌러 첫 글을 남겨 봐요!</div>
</main>
<div id="fabs"><button id="rand" title="아무 글이나 보기">🎲</button><button id="fab">✏️ 글쓰기</button></div>
<div class="ov hidden" id="ov"></div>
<div id="toast"></div>
<div id="mpop" class="hidden"></div>
<script>
/* ================= 설정 ================= */
const ROOM = 'ig0rwp40uk', PIN_HASH = 'otmq3z4t1s';
const BASE = `jhgames/board/${ROOM}/`, TOPIC = BASE + 'p/';

const MSTK = ['','😀','🥰','😂','👍','💖','🌈','⭐','🎉','🍀','🐶','🐱','🍭','🙏','😢','🤗'];

const STICKERS = ['','😀','😂','🥰','😎','🤩','😮','😭','👍','👏','💪','🙌','❤️','💖','⭐','🌈','🎉','🎂','🍕','🍦','⚽','🏆','🌸','🍀','🐶','🐱','🦄','🦖','🚀','☀️','🌙','❄️'];

const BAD = ['씨발','시발','ㅅㅂ','ㅆㅂ','병신','ㅂㅅ','개새','새끼','ㅅㄲ','미친','ㅁㅊ','존나','졸라','ㅈㄴ','지랄','ㅈㄹ','꺼져','닥쳐','엿먹','fuck','shit'];
