<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>우리 반 게시판</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{--ink:#3b2a10;--soft:#8a7650}
  html,body{min-height:100%}
  body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:#fff7e0 radial-gradient(circle at 20% 0%,#ffe8a3 0,transparent 45%),radial-gradient(circle at 100% 30%,#ffd6e0 0,transparent 40%);background-attachment:fixed}
  button{font-family:inherit;cursor:pointer;color:inherit}
  input,textarea{font-family:inherit}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,247,224,.92);backdrop-filter:blur(6px);border-bottom:3px solid #f3d27a}
  header h1{font-size:clamp(20px,4.5vw,30px);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib{border:0;border-radius:14px;height:42px;padding:0 12px;font-size:16px;font-weight:900;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
  .ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.12)}
  #net{font-size:13px;color:var(--soft);white-space:nowrap}
  #net i{display:inline-block;width:10px;height:10px;border-radius:50%;background:#adb5bd;margin-right:4px;vertical-align:-1px}
  #net.on i{background:#40c057;box-shadow:0 0 0 3px rgba(64,192,87,.25)}
  #teach.on{background:#4dabf7;color:#fff}
  main{padding:14px;max-width:1300px;margin:0 auto}
  .intro{text-align:center;color:var(--soft);font-size:15px;margin:2px 0 12px}
  #wall{columns:270px;column-gap:14px}
  .card{break-inside:avoid;margin:0 0 14px;border-radius:20px;padding:12px 14px 10px;box-shadow:0 5px 0 rgba(0,0,0,.08),0 8px 20px rgba(0,0,0,.06);position:relative;animation:pop .45s}
  @keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
  .card .who{display:flex;align-items:center;gap:8px;font-size:17px}
  .card .av{font-size:30px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .card .tm{font-size:12px;color:rgba(0,0,0,.45);display:block}
  .card .tx{font-size:20px;line-height:1.5;margin:8px 0 4px;white-space:pre-wrap;word-break:break-word}
  .card .st{font-size:64px;text-align:center;line-height:1.15;margin:4px 0}
  .card .rx{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .card .rx button{border:0;border-radius:999px;background:rgba(255,255,255,.75);padding:3px 9px;font-size:16px;font-weight:900}
  .card .rx button.me{background:#fff;box-shadow:0 0 0 2px #f08c00}
  .card .del{position:absolute;right:8px;top:8px;border:0;background:rgba(255,255,255,.8);border-radius:10px;font-size:15px;padding:3px 7px}
  .empty{text-align:center;padding:60px 10px;color:var(--soft);font-size:20px;line-height:1.7}
  #fab{position:fixed;right:18px;bottom:18px;z-index:9;border:0;border-radius:999px;padding:16px 24px;font-size:22px;font-weight:900;background:#ffd23f;box-shadow:0 6px 0 #e0a800,0 10px 24px rgba(0,0,0,.2)}
  #fab:active{transform:translateY(4px);box-shadow:0 2px 0 #e0a800}
  .ov{position:fixed;inset:0;z-index:20;background:rgba(40,25,5,.45);display:flex;align-items:center;justify-content:center;padding:12px}
  .pop{background:#fff;border-radius:24px;padding:16px;width:min(560px,100%);max-height:94vh;overflow:auto;box-shadow:0 10px 0 rgba(0,0,0,.12)}
  .pop h2{text-align:center;font-size:24px;margin-bottom:8px}
  .lbl{font-weight:900;margin:10px 0 4px;font-size:16px}
  .grid{display:flex;flex-wrap:wrap;gap:6px}
  .grid button{border:3px solid transparent;background:#f8f9fa;border-radius:14px;width:48px;height:48px;font-size:28px}
  .grid button.on{border-color:#ffd23f;background:#fff3bf}
  .cols button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #dee2e6}
  .cols button.on{box-shadow:0 0 0 4px var(--ink)}
  #nm{font-size:20px;border:3px solid #ffd23f;border-radius:14px;padding:6px 10px;width:100%}
  #tx{font-size:20px;border:3px solid #dee2e6;border-radius:14px;padding:8px 10px;width:100%;height:110px;resize:none}
  .cnt{text-align:right;font-size:12px;color:var(--soft)}
  .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .btn{border:0;border-radius:14px;padding:11px 18px;font-size:18px;font-weight:900;background:#e9ecef;box-shadow:0 4px 0 rgba(0,0,0,.12)}
  .btn.y{background:#ffd23f}.btn.r{background:#ff6b6b;color:#fff}.btn.b{background:#4dabf7;color:#fff}
  .btn:disabled{opacity:.45}
  .msg{text-align:center;color:#e03131;font-size:14px;min-height:18px;margin-top:6px}
  #toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:30;background:rgba(59,42,16,.92);color:#fff;padding:8px 18px;border-radius:999px;font-size:16px;pointer-events:none;white-space:nowrap}
  #toast:empty{display:none}
  .pin{font-size:30px;width:170px;text-align:center;letter-spacing:10px;border:3px solid #4dabf7;border-radius:14px;padding:6px;display:block;margin:6px auto}
  .prev{border-radius:18px;padding:10px;margin-top:10px}
</style>
</head>
<body>
<header>
  <a class="ib" href="index.html">🏠</a>
  <h1>📌 우리 반 게시판</h1>
  <span id="net"><i></i><span id="netT">연결 중…</span></span>
  <button class="ib" id="teach" title="선생님">👩‍🏫</button>
</header>
<main>
  <div class="intro">친구들에게 하고 싶은 말을 남겨요! 고운 말을 써요 😊</div>
  <div id="wall"></div>
  <div class="empty" id="empty">아직 글이 없어요 🌱<br>아래 <b>✏️ 글쓰기</b>를 눌러 첫 글을 남겨 봐요!</div>
</main>
<button id="fab">✏️ 글쓰기</button>
<div class="ov hidden" id="ov"></div>
<div id="toast"></div>
<script>
/* ================= 설정 ================= */
const ROOM = 'ig0rwp40uk', PIN_HASH = 'otmq3z4t1s';
const TOPIC = `jhgames/board/${ROOM}/p/`;
const BROKERS = window.__BROKERS || ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt'];
const AVS = ['🐶','🐱','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐸','🐵','🐧','🐥','🦄','🐙','🦖','🐳','🦋','🐞','🐹'];
const STICKERS = ['','😀','😂','🥰','😎','🤩','😮','😭','👍','👏','💪','🙌','❤️','💖','⭐','🌈','🎉','🎂','🍕','🍦','⚽','🏆','🌸','🍀','🐶','🐱','🦄','🦖','🚀','☀️','🌙','❄️'];
const COLORS = ['#fff3bf','#ffe3e3','#d3f9d8','#d0ebff','#f3d9fa','#ffe8cc','#e6fcf5','#fff'];
const REACTS = ['❤️','👍','😂','😮','🎉'];
const BAD = ['씨발','시발','ㅅㅂ','ㅆㅂ','병신','ㅂㅅ','개새','새끼','ㅅㄲ','미친','ㅁㅊ','존나','졸라','ㅈㄴ','지랄','ㅈㄹ','꺼져','닥쳐','엿먹','fuck','shit'];
const LS = (k, v) => { try{ if(v === undefined){ const x = localStorage.getItem(k); return x === null ? null : JSON.parse(x); } localStorage.setItem(k, JSON.stringify(v)); }catch(e){ return null; } };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => { let t = String(s || ''); BAD.forEach(w => { t = t.split(w).join('♡'.repeat(Math.min(3, w.length))); }); return t; };
let ME = LS('jhBoardMe') || {}; if(!ME.id){ ME.id = 'd' + Math.random().toString(36).slice(2, 10); ME.av = AVS[Math.floor(Math.random()*AVS.length)]; ME.col = COLORS[0]; LS('jhBoardMe', ME); }
const MYR = LS('jhBoardReact') || {};
let teacher = false;

/* ================= 소리 · 알림 ================= */
let actx = null; const ac = () => { try{ actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === 'suspended') actx.resume(); }catch(e){} return actx; };
function tone(f, d=.1, delay=0){ const a = ac(); if(!a) return; try{ const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain(); o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d + .02); }catch(e){} }
let tT = 0; function toast(t, ms=2000){ $('toast').textContent = t; clearTimeout(tT); tT = setTimeout(() => $('toast').textContent = '', ms); }

/* ================= 서버 (MQTT 중계, 메시지를 서버에 보관) ================= */
function mqttConnect(url, onPub){ return new Promise((res, rej) => {
  let ws; try{ ws = new WebSocket(url, ['mqtt']); }catch(e){ rej('ws'); return; }
  ws.binaryType = 'arraybuffer'; const enc = new TextEncoder(), dec = new TextDecoder(); let buf = new Uint8Array(0), pid = 1, ok = false, ping = null;
  const to = setTimeout(() => { if(!ok){ rej('timeout'); try{ ws.close(); }catch(e){} } }, 8000);
  const str = s => { const b = enc.encode(s); return [b.length >> 8, b.length & 255, ...b]; };
  const pkt = (h, body) => { const len = []; let n = body.length; do{ let d = n % 128; n = Math.floor(n/128); if(n > 0) d |= 128; len.push(d); }while(n > 0); const u = new Uint8Array(1 + len.length + body.length); u[0] = h; u.set(len, 1); u.set(body, 1 + len.length); return u; };
  const send = u8 => { try{ if(ws.readyState === 1){ ws.send(u8); return true; } }catch(e){} return false; };
  const api = {sub(t){ const id = pid++; send(pkt(0x82, [id >> 8, id & 255, ...str(t), 0])); },
    pub(t, o, ret){ const p = enc.encode(JSON.stringify(o)), b = str(t), body = new Uint8Array(b.length + p.length); body.set(b); body.set(p, b.length); return send(pkt(ret ? 0x31 : 0x30, body)); },
    close(){ clearInterval(ping); api.onclose = null; try{ ws.close(); }catch(e){} }, onclose:null, get open(){ return ws.readyState === 1; }};
  ws.onopen = () => send(pkt(0x10, [...str('MQTT'), 4, 2, 0, 60, ...str('jb' + Math.random().toString(36).slice(2, 12))]));
  ws.onmessage = e => { const d = new Uint8Array(e.data), nb = new Uint8Array(buf.length + d.length); nb.set(buf); nb.set(d, buf.length); buf = nb;
    while(buf.length >= 2){ let mul = 1, len = 0, i = 1, b; do{ if(i >= buf.length) return; b = buf[i++]; len += (b & 127)*mul; mul *= 128; }while(b & 128);
      if(buf.length < i + len) return; const h = buf[0], body = buf.slice(i, i + len); buf = buf.slice(i + len); const type = h >> 4;
      if(type === 2){ if(body[1] === 0){ ok = true; clearTimeout(to); ping = setInterval(() => send(new Uint8Array([0xC0, 0])), 25000); res(api); } else { clearTimeout(to); rej('refused'); } }
      else if(type === 3){ const tl = (body[0] << 8) | body[1], topic = dec.decode(body.slice(2, 2 + tl)); let p = 2 + tl; if((h >> 1) & 3) p += 2; let o = null; try{ o = JSON.parse(dec.decode(body.slice(p))); }catch(_){} if(o) onPub(topic, o); } } };
  ws.onerror = () => { clearTimeout(to); if(!ok) rej('ws'); };
  ws.onclose = () => { clearInterval(ping); clearTimeout(to); if(!ok) rej('ws'); else if(api.onclose) api.onclose(); }; }); }
const CONN = {}, POSTS = {}, SEEN = {};
function onPub(bi, topic, o){ if(!topic.startsWith(TOPIC) || !o || !o.id) return; (SEEN[o.id] = SEEN[o.id] || new Set()).add(bi);
  const cur = POSTS[o.id]; if(cur && (cur.u || 0) >= (o.u || 0)) return; const isNew = !cur && !o.del && Date.now() - (o.t || 0) < 60000 && o.a !== ME.id;
  POSTS[o.id] = o; scheduleRender(); if(isNew){ tone(880); tone(1175, .1, .08); toast(`📌 ${clean(o.n)} 친구가 새 글을 올렸어요!`); } }
async function connect(bi){ if(CONN[bi]) return; try{ const api = await mqttConnect(BROKERS[bi], (t, o) => onPub(bi, t, o)); CONN[bi] = api; api.sub(TOPIC + '+'); netUI();
    api.onclose = () => { delete CONN[bi]; netUI(); setTimeout(() => connect(bi), 5000); }; setTimeout(() => sync(bi), 4000); }
  catch(e){ netUI(); setTimeout(() => connect(bi), 15000); } }
function sync(bi){ const api = CONN[bi]; if(!api) return; for(const id in POSTS){ if(!(SEEN[id] && SEEN[id].has(bi))) api.pub(TOPIC + id, POSTS[id], true); } }
function save(o){ o.u = Date.now(); POSTS[o.id] = o; let n = 0; for(const bi in CONN){ if(CONN[bi].pub(TOPIC + o.id, o, true)){ n++; (SEEN[o.id] = SEEN[o.id] || new Set()).add(+bi); } } scheduleRender(); return n; }
function netUI(){ const n = Object.keys(CONN).length; $('net').classList.toggle('on', n > 0); $('netT').textContent = n ? `연결됨` : '연결 중…'; }
BROKERS.forEach((_, i) => connect(i));

/* ================= 그리기 ================= */
let rT = 0; function scheduleRender(){ clearTimeout(rT); rT = setTimeout(render, 60); }
function ago(t){ const s = Math.max(0, (Date.now() - t)/1000); if(s < 60) return '방금'; if(s < 3600) return Math.floor(s/60) + '분 전'; if(s < 86400) return Math.floor(s/3600) + '시간 전';
  const d = new Date(t); return `${d.getMonth() + 1}월 ${d.getDate()}일`; }
function render(){ const L = Object.values(POSTS).filter(p => !p.del).sort((a, b) => b.t - a.t).slice(0, 300); $('empty').classList.toggle('hidden', L.length > 0);
  const old = new Set([...document.querySelectorAll('.card')].map(c => c.dataset.id));
  $('wall').innerHTML = L.map(p => { const mine = p.a === ME.id, r = p.r || {}, my = MYR[p.id] || [];
    return `<div class="card" data-id="${esc(p.id)}" style="background:${COLORS.includes(p.c) ? p.c : COLORS[0]};${old.has(p.id) ? 'animation:none' : ''}">
      ${mine || teacher ? `<button class="del" data-del="${esc(p.id)}" title="지우기">🗑️</button>` : ''}
      <div class="who"><span class="av">${AVS.includes(p.av) ? p.av : '🙂'}</span><span>${esc(clean(p.n || '친구'))}<span class="tm">${ago(p.t)}</span></span></div>
      ${p.s && STICKERS.includes(p.s) ? `<div class="st">${p.s}</div>` : ''}${p.x ? `<div class="tx">${esc(clean(p.x))}</div>` : ''}
      <div class="rx">${REACTS.map(e => `<button data-r="${esc(p.id)}" data-e="${e}" class="${my.includes(e) ? 'me' : ''}">${e} ${r[e] || ''}</button>`).join('')}</div></div>`; }).join(''); }
setInterval(render, 60000);
$('wall').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.r){ const p = POSTS[b.dataset.r], em = b.dataset.e; if(!p) return; ac(); const my = MYR[p.id] = MYR[p.id] || [], r = p.r = {...(p.r || {})};
    if(my.includes(em)){ my.splice(my.indexOf(em), 1); r[em] = Math.max(0, (r[em] || 1) - 1); } else { my.push(em); r[em] = (r[em] || 0) + 1; tone(1046); tone(1318, .1, .07); }
    LS('jhBoardReact', MYR); if(!save({...p, r})) toast('⚠️ 서버에 연결이 안 됐어요'); }
  if(b.dataset.del){ const p = POSTS[b.dataset.del]; if(!p) return; ask(`🗑️ 이 글을 지울까요?`, () => { save({id:p.id, t:p.t, del:1}); toast('🗑️ 지웠어요'); }); } });

/* ================= 글쓰기 ================= */
function ov(html, after){ $('ov').innerHTML = `<div class="pop">${html}</div>`; $('ov').classList.remove('hidden'); if(after) after(); }
function closeOv(){ $('ov').classList.add('hidden'); }
$('ov').addEventListener('pointerdown', e => { if(e.target === $('ov')) closeOv(); });
function ask(t, yes){ ov(`<h2>${t}</h2><div class="row"><button class="btn r" id="aY">네</button><button class="btn" id="aN">아니요</button></div>`, () => { $('aY').onclick = () => { closeOv(); yes(); }; $('aN').onclick = closeOv; }); }
let draft = {s:''};
function openWrite(){ ac(); if(!Object.keys(CONN).length){ toast('📡 아직 서버에 연결 중이에요. 잠깐만요!'); }
  ov(`<h2>✏️ 글쓰기</h2>
    <div class="lbl">🙂 내 캐릭터</div><div class="grid" id="gAv">${AVS.map(a => `<button data-v="${a}" class="${ME.av === a ? 'on' : ''}">${a}</button>`).join('')}</div>
    <div class="lbl">📛 이름</div><input id="nm" maxlength="10" placeholder="이름을 써요" value="${esc(ME.nm || '')}">
    <div class="lbl">💬 하고 싶은 말</div><textarea id="tx" maxlength="200" placeholder="친구들에게 하고 싶은 말을 써요 (고운 말 😊)"></textarea><div class="cnt" id="cnt">0 / 200</div>
    <div class="lbl">🎨 큰 이모지 붙이기 (안 붙여도 돼요)</div><div class="grid" id="gSt">${STICKERS.map(s => `<button data-v="${s}" class="${draft.s === s ? 'on' : ''}">${s || '✖️'}</button>`).join('')}</div>
    <div class="lbl">🖍️ 종이 색깔</div><div class="grid cols" id="gCol">${COLORS.map(c => `<button data-v="${c}" style="background:${c}" class="${ME.col === c ? 'on' : ''}"></button>`).join('')}</div>
    <div class="msg" id="wMsg"></div>
    <div class="row"><button class="btn y" id="wGo">📌 올리기</button><button class="btn" id="wX">취소</button></div>`, () => {
    const pickIn = (id, f) => $(id).querySelectorAll('button').forEach(b => b.onclick = () => { $(id).querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); f(b.dataset.v); tone(700, .05); });
    pickIn('gAv', v => ME.av = v); pickIn('gSt', v => draft.s = v); pickIn('gCol', v => ME.col = v);
    $('tx').oninput = () => $('cnt').textContent = `${$('tx').value.length} / 200`; $('wX').onclick = closeOv; $('wGo').onclick = post; setTimeout(() => $('tx').focus(), 100); }); }
function post(){ const nm = $('nm').value.trim().slice(0, 10), x = $('tx').value.trim().slice(0, 200);
  if(!nm){ $('wMsg').textContent = '📛 이름을 써 주세요'; return; } if(!x && !draft.s){ $('wMsg').textContent = '💬 글을 쓰거나 이모지를 골라요'; return; }
  const wait = 15000 - (Date.now() - (ME.last || 0)); if(wait > 0 && !teacher){ $('wMsg').textContent = `⏳ ${Math.ceil(wait/1000)}초 뒤에 다시 올릴 수 있어요`; return; }
  if(BAD.some(w => (nm + x).includes(w))){ $('wMsg').textContent = '🙅 고운 말을 써 주세요!'; tone(220, .2); return; }
  ME.nm = nm; ME.last = Date.now(); LS('jhBoardMe', ME);
  const o = {id:Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t:Date.now(), a:ME.id, n:nm, av:ME.av, c:ME.col, x, s:draft.s, r:{}};
  const n = save(o); closeOv(); draft = {s:''}; [523, 659, 784].forEach((f, i) => tone(f, .12, i*.08)); toast(n ? '📌 올렸어요!' : '⚠️ 서버 연결이 안 돼서 나만 보여요. 연결되면 자동으로 올라가요', 3000); }
$('fab').onclick = openWrite;

/* ================= 선생님 (글 관리) ================= */
function cy(str, seed=0){ let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for(let i = 0; i < str.length; i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 2654435761); h2 = Math.imul(h2 ^ ch, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296*(2097151 & h2) + (h1 >>> 0)).toString(36); }
$('teach').onclick = () => { if(teacher){ ov(`<h2>👩‍🏫 선생님 관리</h2><div style="text-align:center;color:#8a7650">모든 글에 🗑️ 버튼이 보여요</div>
