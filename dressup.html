<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>얼굴 꾸미기</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#fff4fb;color:#2b2140;user-select:none;-webkit-user-select:none}
  button{font:inherit;cursor:pointer}
  header{height:56px;display:flex;align-items:center;gap:6px;padding:0 10px;background:linear-gradient(90deg,#ff7ab8,#a77bff);color:#fff;overflow-x:auto;white-space:nowrap}
  header h1{font-size:19px;font-weight:900;margin:0 8px 0 2px;flex-shrink:0}
  header .sp{flex:1}
  .hb{flex-shrink:0;border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#5b2d8a;font-size:14px;font-weight:800;padding:8px 12px;text-decoration:none}
  .hb.y{background:#ffdf4d;color:#5a3b00}
  .wrap{display:flex;height:calc(100% - 56px)}
  #stageBox{flex:1;display:flex;align-items:center;justify-content:center;padding:10px;min-width:0;min-height:0}
  #stage{touch-action:none;border-radius:20px;box-shadow:0 8px 0 rgba(120,60,160,.25);background:#fff}
  #panel{width:380px;flex-shrink:0;background:#fff;border-left:3px solid #f1defa;display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;padding:8px 8px 0;gap:6px}
  .tab{flex:1;border:0;border-radius:14px 14px 0 0;background:#f4e9fb;color:#7a4fa3;font-weight:900;font-size:15px;padding:10px 4px}
  .tab.on{background:#a77bff;color:#fff}
  .pane{flex:1;overflow-y:auto;padding:12px;touch-action:pan-y;border-top:3px solid #a77bff}
  .sec{font-size:13px;font-weight:900;color:#8a63b5;margin:4px 2px 8px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
  .grid.g4{grid-template-columns:repeat(4,1fr)}
  .grid.g5{grid-template-columns:repeat(5,1fr)}
  .it{border:3px solid transparent;border-radius:16px;background:#f8f2fd;padding:8px 4px;text-align:center;font-size:13px;font-weight:800;color:#4b3566;display:flex;flex-direction:column;align-items:center;gap:2px}
  .it .e{font-size:30px;line-height:1.15}
  .it.on{border-color:#a77bff;background:#efe4ff}
  .it:active{transform:scale(.94)}
  .sw{width:100%;aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #e4d4f3}
  .sw.on{box-shadow:0 0 0 4px #a77bff}
  .bgp{height:54px;border-radius:12px;width:100%}
  .row{display:flex;gap:8px;margin-bottom:12px}
  .row .it{flex:1}
  .wide{width:100%;border:0;border-radius:14px;padding:12px;font-weight:900;font-size:15px;background:#ffe3ef;color:#c2185b;margin-bottom:8px}
  .tip{font-size:12.5px;color:#8b7a9c;line-height:1.55;background:#faf6fe;border-radius:12px;padding:10px 12px}
  @media (orientation:portrait), (max-width:760px){
    .wrap{flex-direction:column}
    #panel{width:100%;height:44%;border-left:0;border-top:3px solid #f1defa}
    #stageBox{padding:6px}
    .grid{grid-template-columns:repeat(4,1fr)}
    .grid.g4{grid-template-columns:repeat(5,1fr)}
    .grid.g5{grid-template-columns:repeat(8,1fr)}
  }
  /* 오버레이 */
  .ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;background:linear-gradient(160deg,#ff9ccc,#a77bff);color:#fff;padding:20px 14px;overflow-y:auto}
  .ov h2{font-size:clamp(26px,6vw,40px);font-weight:900;text-shadow:0 3px 0 rgba(90,30,140,.35);text-align:center}
  .ov .sub{font-weight:700;opacity:.95;margin:6px 0 16px;text-align:center}
  .pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:520px}
  .pk{background:rgba(255,255,255,.95);border:0;border-radius:20px;padding:10px 6px 8px;color:#4b3566;font-weight:900;font-size:15px;box-shadow:0 5px 0 rgba(90,30,140,.3)}
  .pk img{width:100%;aspect-ratio:1;object-fit:contain}
  .pk:active{transform:translateY(3px)}
  .modal{position:fixed;inset:0;z-index:30;background:rgba(40,10,70,.75);display:flex;align-items:center;justify-content:center;padding:16px}
  .card{background:#fff;border-radius:22px;padding:18px;max-width:560px;width:100%;max-height:100%;overflow:auto;text-align:center;color:#2b2140}
  .card h3{font-size:21px;margin-bottom:8px}
  .card img.result{width:100%;max-width:360px;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
  .card .btns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
  .card .btns a,.card .btns button{border:0;border-radius:999px;padding:11px 18px;font-weight:900;font-size:15px;text-decoration:none;background:#efe4ff;color:#5b2d8a}
  .card .btns .y{background:#ffdf4d;color:#5a3b00}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:6px}
  .gi{position:relative;border-radius:14px;overflow:hidden;background:#f6effc}
  .gi img{width:100%;display:block}
  .gi span{display:block;font-size:13px;font-weight:800;padding:4px}
  .gi button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:13px}
  #show{position:fixed;inset:0;z-index:40;background:radial-gradient(ellipse at 50% 0%,#5b3a8c 0%,#1a0f2e 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#fff}
  #show .spot{position:absolute;top:-10%;left:50%;width:70vmin;height:120vh;transform:translateX(-50%);background:linear-gradient(rgba(255,255,220,.35),rgba(255,255,220,0));clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);pointer-events:none}
  #show img{height:68vh;max-width:86vw;border-radius:18px;box-shadow:0 0 50px rgba(255,230,150,.5);animation:walk .9s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes walk{from{transform:translateX(110vw) rotate(10deg)}to{transform:none}}
  #show .nm{font-size:clamp(26px,6vw,46px);font-weight:900;margin-top:16px;text-shadow:0 3px 0 #7a3cbf}
  #show .x{position:absolute;top:12px;right:12px;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:20px}
  #show .stage-title{position:absolute;top:16px;left:0;right:0;text-align:center;font-weight:900;font-size:20px;opacity:.9}
  .conf{position:absolute;top:-40px;font-size:28px;animation:fall linear forwards;pointer-events:none}
  @keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
  .toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(60,20,100,.85);color:#fff;font-weight:800;padding:10px 18px;border-radius:999px;z-index:50;pointer-events:none;transition:opacity .3s}
  .hidden{display:none!important}
</style>
</head>
<body>
<header>
  <a class="hb" href="index.html">🏠</a>
  <h1>👗 얼굴 꾸미기</h1>
  <button class="hb" id="whoBtn">👤 친구 바꾸기</button>
  <span class="sp"></span>
  <button class="hb" id="undoBtn">↩️ 되돌리기</button>
  <button class="hb" id="randBtn">🎲 랜덤</button>
  <button class="hb" id="clearBtn">🧹 처음부터</button>
  <button class="hb" id="galBtn">🖼️ 전시장</button>
  <button class="hb y" id="saveBtn">📸 완성!</button>
</header>
<div class="wrap">
  <div id="stageBox"><canvas id="stage"></canvas></div>
  <div id="panel">
    <div class="tabs">
      <button class="tab on" data-t="outfit">👕 옷</button>
      <button class="tab" data-t="sticker">🎀 소품</button>
      <button class="tab" data-t="doodle">✏️ 낙서</button>
      <button class="tab" data-t="bg">🏞️ 배경</button>
    </div>
    <div class="pane" id="pane-outfit">
      <div class="sec">옷 고르기</div><div class="grid" id="outfits"></div>
      <div class="sec">🎨 옷 색깔 바꾸기</div><div class="grid g5" id="colors"></div>
    </div>
    <div class="pane hidden" id="pane-sticker">
      <div class="sec">눌러서 붙이고, 끌어서 옮겨요</div><div class="grid g4" id="stickers"></div>
      <div class="tip">👆 소품을 끌면 이동 · 🔄 오른쪽 아래 동그라미를 끌면 크기·회전 · ✖ 누르면 삭제<br>두 손가락으로 벌리거나 돌려도 돼요!</div>
    </div>
    <div class="pane hidden" id="pane-doodle">
      <div class="sec">도구</div><div class="grid g5" id="tools"></div>
      <div class="sec">색깔</div><div class="grid g5" id="pens"></div>
      <div class="sec">굵기</div><div class="row" id="sizes"></div>
      <button class="wide" id="clearDoodle">🧽 낙서만 다 지우기</button>
      <div class="tip">✏️ 낙서 탭이 켜져 있을 때 그림 위에 손가락으로 그려요.</div>
    </div>
    <div class="pane hidden" id="pane-bg">
      <div class="sec">배경 고르기</div><div class="grid" id="bgs"></div>
    </div>
  </div>
</div>

<!-- 친구 고르기 -->
<div class="ov" id="picker">
  <h2>👗 누구를 꾸며 볼까요?</h2>
  <div class="sub">친구를 골라서 멋진 옷을 입혀 주세요!</div>
  <div class="pick" id="pickGrid"></div>
  <a class="hb" href="index.html" style="margin-top:18px">🏠 게임 목록</a>
</div>

<!-- 완성 -->
<div class="modal hidden" id="doneModal">
  <div class="card">
    <h3 id="doneTitle">✨ 완성!</h3>
    <img class="result" id="doneImg" alt="">
    <div class="btns">
      <button class="y" id="exhibitBtn">🖼️ 전시장에 걸기</button>
      <a id="dlBtn" download="꾸미기.png">💾 사진 저장</a>
      <button id="doneClose">계속 꾸미기</button>
    </div>
    <div class="tip" style="margin-top:10px">아이패드에서 저장이 안 되면 사진을 길게 눌러 "사진 앱에 저장"을 눌러요.</div>
  </div>
</div>

<!-- 전시장 -->
<div class="modal hidden" id="galModal">
  <div class="card">
    <h3>🖼️ 우리반 전시장</h3>
    <div class="btns" style="margin:0 0 8px"><button class="y" id="showBtn">🎤 패션쇼 시작!</button><button id="galClose">닫기</button></div>
    <div class="gal" id="gal"></div>
  </div>
</div>

<!-- 패션쇼 -->
<div id="show" class="hidden">
  <div class="spot"></div>
  <div class="stage-title">🎤 우리반 패션쇼</div>
  <img id="showImg" alt="">
  <div class="nm" id="showName"></div>
  <button class="x" id="showClose">✕</button>
</div>

/* ---------- 얼굴 이미지 + 피부색 ---------- */
const faces = FACE_SRCS.map(src => { const im = new Image(); im.src = src; return im; });
const skins = FACE_SRCS.map(() => '#f2c9a6');
faces.forEach((im,i) => im.onload = () => {
  try{
    const c = document.createElement('canvas'), w = 60, h = Math.round(60*im.naturalHeight/im.naturalWidth);
    c.width = w; c.height = h; const g = c.getContext('2d'); g.drawImage(im,0,0,w,h);
    const d = g.getImageData(Math.floor(w*.3), Math.floor(h*.58), Math.floor(w*.4), Math.floor(h*.16)).data;
    let r=0,gg=0,b=0,n=0; for(let k=0;k<d.length;k+=4){ if(d[k+3]>200){ r+=d[k]; gg+=d[k+1]; b+=d[k+2]; n++; } }
    if(n) skins[i] = `rgb(${r/n|0},${gg/n|0},${b/n|0})`;
  }catch(e){}
  draw();
});

/* ---------- 사운드 ---------- */
let actx = null;
function tone(f,dur=.1,type='sine',vol=.08,slide=0,delay=0){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime+delay;
    o.type = type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur);
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }catch(e){}
}
function clap(n=10){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<n;i++){ const len = actx.sampleRate*.08|0, buf = actx.createBuffer(1,len,actx.sampleRate), d = buf.getChannelData(0);
      for(let k=0;k<len;k++) d[k] = (Math.random()*2-1)*Math.pow(1-k/len,3);
      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      f.type='bandpass'; f.frequency.value = 1400+Math.random()*900; g.gain.value = .35; s.buffer = buf; s.connect(f).connect(g).connect(actx.destination);
      s.start(actx.currentTime + i*.11 + Math.random()*.05); } }catch(e){}
}
const SND = { pop:()=>tone(700,.08,'sine',.1,500), swish:()=>tone(300,.18,'triangle',.07,700), click:()=>tone(1000,.04,'sine',.06),
  del:()=>tone(500,.12,'sine',.08,-350), ta:()=>[523,659,784,1046].forEach((f,i)=>tone(f,.15,'triangle',.08,0,i*.08)) };

let history = [], tab = 'outfit', sel = -1;
let tool = 'pen', penColor = '#ff3b6b', penSize = 10;
function snapshot(){ return JSON.stringify({outfit:S.outfit, color:S.color, bg:S.bg, stickers:S.stickers, n:S.strokes.length}); }
function commit(){ history.push({...JSON.parse(snapshot()), strokes:S.strokes.slice()}); if(history.length > 60) history.shift(); }
function undo(){
  if(history.length < 2){ toast('더 되돌릴 게 없어요'); return; }
  history.pop(); const h = history[history.length-1];
  S.outfit = h.outfit; S.color = h.color; S.bg = h.bg; S.stickers = JSON.parse(JSON.stringify(h.stickers)); S.strokes = h.strokes.slice();
  sel = -1; redrawDoodle(); refreshUI(); draw(); SND.swish();
}

const P = {

    p.lineTo(394,552); p.lineTo(206,552); p.lineTo(186,392); p.quadraticCurveTo(188,358,208,352); p.closePath(); return p; },
  legs(len=742){ const p = new Path2D(); p.roundRect(214,528,172,74,22); p.roundRect(220,540,72,len-540,26); p.roundRect(308,540,72,len-540,26); return p; },
};
function limb(g,x1,y1,x2,y2,w,c){ g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.stroke(); }
const ARM = { L:[204,378,156,548], R:[396,378,444,548] };
function arms(g, c, len){ // len: 0=민소매 .45=반팔 1=긴팔
  for(const a of [ARM.L, ARM.R]){
    if(len < 1){ limb(g,a[0],a[1],a[2],a[3],40,skin()); }
    if(len > 0){ limb(g,a[0],a[1],a[0]+(a[2]-a[0])*len,a[1]+(a[3]-a[1])*len,48,c); }
  }
}
function hands(g){ g.fillStyle = skin(); for(const [x,y] of [[152,560],[448,560]]){ g.beginPath(); g.arc(x,y,24,0,7); g.fill(); } }
function shoes(g,c){ g.fillStyle = c; for(const x of [254,346]){ g.beginPath(); g.ellipse(x+(x<300?-8:8),752,46,20,0,0,7); g.fill(); } }

function dots(g, path, c, step=34, r=7){ g.save(); g.clip(path); g.fillStyle = c; for(let y=330;y<800;y+=step) for(let x=170+((y/step)%2)*step/2;x<440;x+=step){ g.beginPath(); g.arc(x,y,r,0,7); g.fill(); } g.restore(); }
function shade(c, k){ // k<0 어둡게, k>0 밝게
  const m = c.match(/^#(..)(..)(..)$/); if(!m) return c;
  const f = v => Math.max(0,Math.min(255, Math.round(k>0 ? v+(255-v)*k : v*(1+k))));
  return `rgb(${f(parseInt(m[1],16))},${f(parseInt(m[2],16))},${f(parseInt(m[3],16))})`;
}

const DS = 2, doodle = document.createElement('canvas'); doodle.width = LW*DS; doodle.height = LH*DS;
const dg = doodle.getContext('2d'); dg.scale(DS,DS); dg.lineCap = 'round'; dg.lineJoin = 'round';
const PENS = ['#ff3b6b','#ff9f1c','#ffd60a','#57cc99','#2f6fe0','#7b2ff7','#ff7eb6','#8d5524','#222222','#ffffff'];
const TOOLS = [['pen','🖊️','펜'],['hl','🖍️','형광펜'],['rainbow','🌈','무지개'],['sparkle','✨','반짝이'],['eraser','🧽','지우개']];
function drawSeg(st, i){
  const a = st.pts[i-1], b = st.pts[i]; if(!a || !b) return;

  if(st.t==='eraser'){ dg.globalCompositeOperation = 'destination-out'; dg.strokeStyle = '#000'; dg.lineWidth = st.w*2.2; }
  else if(st.t==='hl'){ dg.globalAlpha = .35; dg.strokeStyle = st.c; dg.lineWidth = st.w*2.6; dg.lineCap = 'butt'; }

  else if(st.t==='sparkle'){ dg.restore(); return; }
  else { dg.strokeStyle = st.c; dg.lineWidth = st.w; }

}

function redrawDoodle(){
  dg.clearRect(0,0,LW,LH);
  for(const st of S.strokes){ for(let i=1;i<st.pts.length;i++) drawSeg(st,i); if(st.stamps) st.stamps.forEach(drawStamp); }
}

/* ---------- 렌더 ---------- */
const cv = $('stage'), ctx = cv.getContext('2d');
let K = 1;   // 화면 px / 논리 px
const CS = .9, CY = 772;   // 캐릭터 전체 크기(발 기준)
function faceBoxRaw(){
  const im = faces[S.face], max = 290; if(!im.naturalWidth) return {x:155,y:72,w:290,h:290};
  const k = max/Math.max(im.naturalWidth, im.naturalHeight), w = im.naturalWidth*k, h = im.naturalHeight*k;
  return {x:300-w/2, y:362-h, w, h};
}
function faceBox(){ const b = faceBoxRaw(); return {x:300+(b.x-300)*CS, y:CY+(b.y-CY)*CS, w:b.w*CS, h:b.h*CS}; }
function outfit(){ return OUTFITS.find(o=>o.id===S.outfit) || OUTFITS[0]; }

  g.restore();

  S.stickers.forEach(st => drawSticker(g, st));
  if(withUI && sel >= 0 && S.stickers[sel] && tab !== 'doodle'){
    const st = S.stickers[sel], [w,h] = stickerSize(st);
    g.save(); g.translate(st.x, st.y); g.rotate(st.r);
    const W2 = w*st.s/2+10, H2 = h*st.s/2+10;
    g.setLineDash([10,8]); g.strokeStyle = '#a77bff'; g.lineWidth = 3/K*1.2; g.strokeRect(-W2,-H2,W2*2,H2*2); g.setLineDash([]);

    g.fillStyle = '#a77bff'; g.beginPath(); g.arc(W2,H2,hr,0,7); g.fill(); g.fillStyle = '#fff'; g.fillText('↻', W2, H2+1);

let raf = 0;
function draw(){ if(raf) return; raf = requestAnimationFrame(()=>{ raf = 0; ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); const d = devicePixelRatio||1; ctx.setTransform(K*d,0,0,K*d,0,0); render(ctx, true); }); }

  K = Math.max(.2, Math.min(bw/LW, bh/LH)); const d = devicePixelRatio||1;
  cv.style.width = LW*K+'px'; cv.style.height = LH*K+'px'; cv.width = Math.round(LW*K*d); cv.height = Math.round(LH*K*d); draw();

new ResizeObserver(fit).observe($('stageBox')); addEventListener('resize', fit);

/* ---------- 포인터 (소품 이동·크기·회전 / 낙서) ---------- */
const ptrs = new Map(); let drag = null, cur = null;
function lp(e){ const r = cv.getBoundingClientRect(); return [(e.clientX-r.left)/K, (e.clientY-r.top)/K]; }
function local(st, x, y){ const dx = x-st.x, dy = y-st.y, c = Math.cos(-st.r), s = Math.sin(-st.r); return [dx*c-dy*s, dx*s+dy*c]; }
function hitSticker(x,y){ for(let i=S.stickers.length-1;i>=0;i--){ const st = S.stickers[i], [w,h] = stickerSize(st), [lx,ly] = local(st,x,y); if(Math.abs(lx) < w*st.s/2+8 && Math.abs(ly) < h*st.s/2+8) return i; } return -1; }
function handleHit(x,y){
  if(sel < 0) return null; const st = S.stickers[sel], [w,h] = stickerSize(st), [lx,ly] = local(st,x,y), W2 = w*st.s/2+10, H2 = h*st.s/2+10, hr = 30/K;
  if(Math.hypot(lx-W2, ly+H2) < hr) return 'del'; if(Math.hypot(lx-W2, ly-H2) < hr) return 'rs'; return null;
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); cv.setPointerCapture(e.pointerId); const [x,y] = lp(e); ptrs.set(e.pointerId, [x,y]);
  if(tab === 'doodle'){
    if(ptrs.size > 1) return;
    cur = {t:tool, c:penColor, w:penSize, pts:[[x,y,(Date.now()/4)%360]], stamps: tool==='sparkle' ? [] : null};
    S.strokes.push(cur); if(tool==='sparkle') addStamp(x,y); else { dg.save(); dg.fillStyle = tool==='eraser' ? '#000' : penColor; if(tool!=='eraser' && tool!=='hl'){ dg.beginPath(); dg.arc(x,y,penSize/2,0,7); dg.fillStyle = tool==='rainbow' ? `hsl(${cur.pts[0][2]},95%,55%)` : penColor; dg.fill(); } dg.restore(); }
    draw(); return;
  }
  if(ptrs.size === 2 && sel >= 0){
    const [a,b] = [...ptrs.values()], st = S.stickers[sel];
    drag = {mode:'pinch', d0: Math.hypot(b[0]-a[0], b[1]-a[1]), a0: Math.atan2(b[1]-a[1], b[0]-a[0]), s0: st.s, r0: st.r}; return;
  }
  const h = handleHit(x,y);
  if(h === 'del'){ S.stickers.splice(sel,1); sel = -1; SND.del(); commit(); draw(); return; }
  if(h === 'rs'){ const st = S.stickers[sel]; drag = {mode:'rs', d0: Math.hypot(x-st.x, y-st.y), a0: Math.atan2(y-st.y, x-st.x), s0: st.s, r0: st.r}; return; }
  const i = hitSticker(x,y);
  if(i >= 0){ sel = i; const st = S.stickers[i]; drag = {mode:'move', ox: x-st.x, oy: y-st.y, moved:false}; SND.click(); }
  else sel = -1;
  draw();
});
cv.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return; const [x,y] = lp(e); ptrs.set(e.pointerId, [x,y]);
  if(tab === 'doodle' && cur){
    const last = cur.pts[cur.pts.length-1]; if(Math.hypot(x-last[0], y-last[1]) < 1.5) return;
    cur.pts.push([x,y,(last[2]+4)%360]);
    if(cur.t === 'sparkle'){ if(Math.hypot(x-(cur.ls||[0,0])[0], y-(cur.ls||[0,0])[1]) > penSize*1.4+6) addStamp(x,y); }
    else drawSeg(cur, cur.pts.length-1);
    draw(); return;
  }
  if(!drag || sel < 0) return; const st = S.stickers[sel];
  if(drag.mode === 'move'){ st.x = x-drag.ox; st.y = y-drag.oy; drag.moved = true; }
  else if(drag.mode === 'rs'){ const d = Math.hypot(x-st.x, y-st.y); st.s = Math.max(.25, Math.min(6, drag.s0*d/drag.d0)); st.r = drag.r0 + Math.atan2(y-st.y, x-st.x) - drag.a0; drag.moved = true; }
  else if(drag.mode === 'pinch' && ptrs.size >= 2){ const [a,b] = [...ptrs.values()]; st.s = Math.max(.25, Math.min(6, drag.s0*Math.hypot(b[0]-a[0], b[1]-a[1])/drag.d0)); st.r = drag.r0 + Math.atan2(b[1]-a[1], b[0]-a[0]) - drag.a0; drag.moved = true; }

function up(e){
  ptrs.delete(e.pointerId);

  if(drag && ptrs.size === 0){ if(drag.moved) commit(); drag = null; }
}
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
function addStamp(x,y){ const s = penSize*.9+6, sp = [x+(Math.random()-.5)*s, y+(Math.random()-.5)*s, s*(.6+Math.random()*.6), Math.random()<.6?'s':'d', PENS[Math.floor(Math.random()*7)]]; cur.stamps.push(sp); cur.ls = [x,y]; drawStamp(sp); }

      if(isVec){ st.k = s[0];

$('clearDoodle').onclick = () => { if(!S.strokes.length) return; S.strokes = []; redrawDoodle(); commit(); draw(); SND.del(); };
$('undoBtn').onclick = undo;
$('clearBtn').onclick = () => { if(!confirm('옷, 소품, 낙서를 모두 지우고 처음부터 할까요?')) return; S.outfit = 'tee'; S.color = null; S.bg = 'classroom'; S.stickers = []; S.strokes = []; sel = -1; redrawDoodle(); commit(); refreshUI(); draw(); };
$('randBtn').onclick = () => {
  const r = a => a[Math.floor(Math.random()*a.length)];
  S.outfit = r(OUTFITS).id; S.color = Math.random()<.5 ? null : r(COLORS); S.bg = r(BGS.slice(0,6)).id;
  const fb = faceBox(); S.stickers = [];
  const hats = ['👑','🎩','🧢','👒','🎀'], eyes = ['🕶️','👓'], fun = ['⭐','❤️','🦋','🌸','🎈','✨','🌈','🍭','🦄','🔥','💖','🍀'];
  if(Math.random()<.75 && !outfit().head) S.stickers.push({e:r(hats), x:300, y:fb.y+18, s:fb.w/150, r:(Math.random()-.5)*.4});
  if(Math.random()<.5) S.stickers.push({e:r(eyes), x:300, y:fb.y+fb.h*.47, s:fb.w/120, r:0});
  if(Math.random()<.4) S.stickers.push({k:'blush', x:300, y:fb.y+fb.h*.62, s:fb.w/300, r:0});
  for(let i=0;i<3;i++) S.stickers.push({e:r(fun), x: i%2 ? 70+Math.random()*90 : 440+Math.random()*90, y: 120+Math.random()*520, s:.6+Math.random()*.6, r:(Math.random()-.5)*.8});
  sel = -1; [523,659,784].forEach((f,i)=>tone(f,.1,'square',.06,0,i*.06)); commit(); refreshUI(); draw();
};

/* ---------- 친구 고르기 ---------- */
function buildPicker(){
  $('pickGrid').innerHTML = '';
  FACE_SRCS.forEach((src,i) => { const b = document.createElement('button'); b.className = 'pk'; b.innerHTML = `<img src="${src}" alt=""><div></div>`; b.querySelector('div').textContent = names[i];
    b.onclick = () => { S.face = i; store.set('duFace', i); $('picker').classList.add('hidden'); SND.ta(); sel = -1; fit(); draw(); if(history.length===0) commit(); }; $('pickGrid').appendChild(b); });
}
$('whoBtn').onclick = () => { $('picker').classList.remove('hidden'); };

/* ---------- 완성 / 저장 / 전시 ---------- */
let lastPNG = null;
function exportCanvas(w){ const c = document.createElement('canvas'); c.width = w; c.height = w*LH/LW; const g = c.getContext('2d'); g.scale(w/LW, w/LW); render(g, false); return c; }
$('saveBtn').onclick = () => {
  sel = -1; draw();
  lastPNG = exportCanvas(1200).toDataURL('image/png');
  $('doneImg').src = lastPNG; $('dlBtn').href = lastPNG; $('dlBtn').download = `${names[S.face]}_꾸미기.png`;
  $('doneTitle').textContent = `✨ ${names[S.face]} 완성!`; $('doneModal').classList.remove('hidden'); SND.ta();
};
$('doneClose').onclick = () => $('doneModal').classList.add('hidden');
$('exhibitBtn').onclick = () => {
  const gal = store.get('duGallery', []), item = {n:names[S.face], img: exportCanvas(330).toDataURL('image/jpeg', .78), t: Date.now()};
  gal.push(item); while(gal.length > 30) gal.shift();
  let ok = store.set('duGallery', gal);
  while(!ok && gal.length > 1){ gal.shift(); ok = store.set('duGallery', gal); }
  clap(8); toast(ok ? '🖼️ 전시장에 걸었어요!' : '저장 공간이 부족해요'); $('doneModal').classList.add('hidden');
};
function renderGallery(){
  const gal = store.get('duGallery', []), box = $('gal'); box.innerHTML = '';
  if(!gal.length){ box.innerHTML = '<div style="grid-column:1/-1;color:#8b7a9c;padding:20px">아직 작품이 없어요.<br>꾸민 다음 📸 완성! → 🖼️ 전시장에 걸기를 눌러 보세요.</div>'; return; }
  gal.slice().reverse().forEach((it, ri) => { const i = gal.length-1-ri, d = document.createElement('div'); d.className = 'gi';
    d.innerHTML = `<img src="${it.img}" alt=""><span></span><button title="삭제">🗑️</button>`; d.querySelector('span').textContent = it.n;
    d.querySelector('button').onclick = () => { if(!confirm('이 작품을 전시장에서 뺄까요?')) return; gal.splice(i,1); store.set('duGallery', gal); renderGallery(); };
    box.appendChild(d); });
}
$('galBtn').onclick = () => { renderGallery(); $('galModal').classList.remove('hidden'); };
$('galClose').onclick = () => $('galModal').classList.add('hidden');

/* ---------- 패션쇼 ---------- */
let showT = null, showI = 0;
function confetti(){ const e = ['🎉','✨','⭐','💖','🌸','🎊']; for(let i=0;i<16;i++){ const s = document.createElement('div'); s.className = 'conf'; s.textContent = e[i%e.length];
  s.style.left = Math.random()*100+'vw'; s.style.animationDuration = (2+Math.random()*2)+'s'; s.style.animationDelay = Math.random()*.6+'s'; $('show').appendChild(s); setTimeout(()=>s.remove(), 5000); } }
function showNext(){
  const gal = store.get('duGallery', []); if(!gal.length) return closeShow();
  const it = gal[showI % gal.length]; showI++;
  const img = $('showImg'); img.style.animation = 'none'; img.offsetHeight; img.style.animation = ''; img.src = it.img;
  $('showName').textContent = `✨ ${it.n} ✨`; clap(10); confetti();
  clearTimeout(showT); showT = setTimeout(showNext, 3600);
}
function closeShow(){ clearTimeout(showT); $('show').classList.add('hidden'); }
$('showBtn').onclick = () => { if(!store.get('duGallery', []).length){ toast('전시된 작품이 없어요'); return; } $('galModal').classList.add('hidden'); $('show').classList.remove('hidden'); showI = 0; SND.ta(); setTimeout(showNext, 300); };
$('show').onclick = e => { if(e.target.id === 'showClose') return; showNext(); };
$('showClose').onclick = e => { e.stopPropagation(); closeShow(); };

/* ---------- 시작 ---------- */
if(!CanvasRenderingContext2D.prototype.roundRect){ const rr = function(x,y,w,h){ this.rect(x,y,w,h); }; CanvasRenderingContext2D.prototype.roundRect = rr; Path2D.prototype.roundRect = rr; }
if(!Path2D.prototype.roundRect) Path2D.prototype.roundRect = function(x,y,w,h){ this.rect(x,y,w,h); };
refreshUI(); buildStickers(); buildPicker(); fit();
</script>
</body>
</html>
