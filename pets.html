<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>멍냥이 구조대</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#ffe9d6;color:#4a2f22;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button{font:inherit;cursor:pointer}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f6d7bd}
  #cv{touch-action:none;display:block;box-shadow:0 8px 30px rgba(120,60,20,.25)}
  #top{position:fixed;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:6px;z-index:5;pointer-events:none}
  #top > *{pointer-events:auto}
  .chip{background:rgba(255,255,255,.92);border-radius:999px;padding:7px 13px;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(120,60,20,.2);white-space:nowrap}
  #top .sp{flex:1}
  .ib{border:0;border-radius:999px;background:#fff;padding:7px 12px;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(120,60,20,.2);color:#6b3e26;white-space:nowrap}
  #bottom{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;z-index:5;padding:0 8px;pointer-events:none}
  #bottom > *{pointer-events:auto}
  .bb{border:0;border-radius:18px;padding:10px 14px;min-width:84px;font-weight:900;font-size:14px;background:#fff;color:#6b3e26;box-shadow:0 4px 0 rgba(120,60,20,.25);display:flex;flex-direction:column;align-items:center;gap:2px}
  .bb .e{font-size:28px;line-height:1.1}
  .bb.y{background:#ffcf33;color:#4a3200}
  .bb.on{background:#ffd9a8;outline:3px solid #ff9f1c}
  .bb:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,60,20,.25)}
  .bb:disabled{opacity:.45}
  #msg{position:fixed;top:56px;left:50%;transform:translateX(-50%);background:rgba(74,47,34,.82);color:#fff;font-weight:800;font-size:15px;padding:8px 16px;border-radius:999px;z-index:6;pointer-events:none;text-align:center;max-width:92vw}
  /* 패널 */
  #panel{position:fixed;right:10px;top:58px;width:290px;max-height:calc(100% - 150px);overflow-y:auto;background:#fff;border-radius:22px;padding:14px;z-index:7;box-shadow:0 8px 24px rgba(120,60,20,.25);touch-action:pan-y}
  #panel .pn{display:flex;align-items:center;gap:10px}
  #panel .pn canvas{width:84px;height:84px;background:#fff4e6;border-radius:16px}
  #panel h3{font-size:20px}
  #panel .kind{font-size:13px;color:#a0705a;font-weight:700}
  .bar{display:flex;align-items:center;gap:6px;margin:6px 0;font-size:13px;font-weight:800}
  .bar .lb{width:62px}
  .bar .tr{flex:1;height:14px;background:#f1e3d6;border-radius:999px;overflow:hidden}
  .bar .fl{height:100%;border-radius:999px}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .acts button{border:0;border-radius:14px;background:#fff1e0;padding:8px 2px;font-weight:900;font-size:12px;color:#6b3e26;display:flex;flex-direction:column;align-items:center}
  .acts button .e{font-size:24px}
  .x{position:absolute;top:8px;right:10px;border:0;background:#f1e3d6;border-radius:50%;width:30px;height:30px;font-weight:900}
  /* 모달 */
  .modal{position:fixed;inset:0;z-index:20;background:rgba(74,47,34,.55);display:flex;align-items:center;justify-content:center;padding:14px}
  .card{background:#fffaf4;border-radius:24px;padding:18px;width:100%;max-width:560px;max-height:100%;overflow-y:auto;text-align:center;position:relative;touch-action:pan-y}
  .card h2{font-size:24px;margin-bottom:6px}
  .card p{line-height:1.6;font-size:15px}
  .card .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
  .btn{border:0;border-radius:999px;padding:12px 22px;font-weight:900;font-size:17px;background:#ffcf33;color:#4a3200;box-shadow:0 4px 0 #c99a00}
  .btn.w{background:#fff;color:#6b3e26;box-shadow:0 4px 0 #e1c3a8}
  .btn.r{background:#ff8fa3;color:#fff;box-shadow:0 4px 0 #d9637a}
  .btn.g{background:#7bd88f;color:#fff;box-shadow:0 4px 0 #4caf68}
  .btn:disabled{opacity:.5}
  input.name{font:inherit;font-size:22px;font-weight:900;text-align:center;border:3px solid #ffcf33;border-radius:16px;padding:8px;width:220px;margin-top:8px}
  .chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:8px}
  .chips button{border:0;border-radius:999px;background:#fff1e0;padding:6px 12px;font-weight:800}
  .tabs{display:flex;gap:6px;justify-content:center;margin:8px 0}
  .tabs button{border:0;border-radius:999px;padding:8px 14px;font-weight:900;background:#f1e3d6;color:#6b3e26}
  .tabs button.on{background:#ff9f1c;color:#fff}
  .album{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
  .al{background:#fff;border-radius:16px;padding:8px;box-shadow:0 3px 0 #f1e3d6}
  .al canvas{width:100%;aspect-ratio:1;background:#fff4e6;border-radius:12px}
  .al b{display:block;font-size:15px}
  .al span{font-size:12px;color:#a0705a;font-weight:700;line-height:1.4;display:block}
  .shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
  .sg{border:0;border-radius:16px;background:#fff;padding:10px 4px;box-shadow:0 3px 0 #f1e3d6;font-weight:900;color:#6b3e26}
  .sg .e{font-size:34px;display:block}
  .sg.own{background:#e9f9ec}
  .sg.on{outline:3px solid #ff9f1c}
  .cust{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border-radius:18px;padding:10px;margin:8px 0}
  .cust img{width:70px;height:70px;object-fit:contain;flex-shrink:0}
  .need{font-size:13px;font-weight:800;color:#d9480f;margin-top:6px;line-height:1.5}
  #title{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#ffd6a5,#ffadad 50%,#bde0fe);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
  #title h1{font-size:clamp(38px,9vw,74px);font-weight:900;color:#fff;text-shadow:0 5px 0 #d9637a}
  #title p{font-size:17px;font-weight:800;margin:10px 0 16px;color:#6b3e26;line-height:1.6}
  #title canvas{width:min(560px,92vw);height:auto}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="top">
  <a class="ib" href="index.html">🏠</a>
  <span class="chip" id="coinChip">🪙 0</span>
  <span class="chip" id="repChip">⭐ 0</span>
  <span class="chip" id="placeChip">🏠 우리집</span>
  <span class="sp"></span>
  <button class="ib" id="muteBtn">🔊</button>
</div>
<div id="msg" class="hidden"></div>
<div id="bottom"></div>
<div id="panel" class="hidden"></div>
<div id="modal" class="modal hidden"><div class="card" id="modalCard"></div></div>

<div id="title">
  <h1>🐶 멍냥이 구조대 🐱</h1>
  <canvas id="titleCv" width="560" height="220"></canvas>
  <p>산에서 길 잃은 강아지·고양이·토끼를 구해 주세요!<br>깨끗이 씻기고, 맛있는 밥 주고, 산책도 하고 🦮<br>사랑으로 키운 다음, 좋은 가족을 찾아 주세요 💝</p>
  <button class="btn" id="startBtn" style="font-size:22px;padding:14px 40px">구조대 출동!</button>
  <a class="btn w" href="index.html" style="margin-top:12px;text-decoration:none;font-size:15px">🏠 게임 목록</a>
</div>

let actx = null, muted = store.get('petMuted', false);
function ac(){ try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){} return actx; }
function tone(f,dur=.1,type='sine',vol=.08,slide=0,delay=0){ if(muted || !ac()) return;
  const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime+delay; o.type = type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+dur); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+.02); }
function noise(dur=.15, vol=.15, freq=1200, delay=0, type='bandpass'){ if(muted || !ac()) return;
  const len = actx.sampleRate*dur|0, buf = actx.createBuffer(1,len,actx.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.sin(Math.PI*i/len);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); f.type = type; f.frequency.value = freq; g.gain.value = vol;
  s.buffer = buf; s.connect(f).connect(g).connect(actx.destination); s.start(actx.currentTime + delay); }

  squeak: () => { tone(1500,.07,'sine',.07,400); tone(1700,.07,'sine',.06,300,.1); },
  happy: () => [659,784,988,1319].forEach((f,i)=>tone(f,.12,'triangle',.08,0,i*.07)),
  coin: () => { tone(988,.07,'square',.05); tone(1319,.12,'square',.05,0,.07); },
  bubble: () => tone(rnd(500,900),.06,'sine',.05,600), splash: () => noise(.3,.18,700), rub: () => noise(.08,.06,2500),
  chomp: () => { noise(.06,.12,500,0,'lowpass'); noise(.06,.12,500,.18,'lowpass'); }, bell: () => [1319,1047].forEach((f,i)=>tone(f,.4,'sine',.08,0,i*.25)),
  click: () => tone(900,.05,'sine',.05,300), bush: () => noise(.2,.12,1800), sad: () => tone(500,.4,'triangle',.06,-200),
  win: () => [523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.15,'square',.05,0,i*.1)), poop: () => tone(200,.15,'square',.06,-100),

function outlined(g,t,x,y,size,fill='#fff',stroke='rgba(74,47,34,.85)'){ g.font = `900 ${size}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.lineWidth = Math.max(3,size/6); g.strokeStyle = stroke; g.strokeText(t,x,y); g.fillStyle = fill; g.fillText(t,x,y); }
function emo(g,t,x,y,size){ g.fillStyle = '#000'; g.globalAlpha = g.globalAlpha; g.font = `${size}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t,x,y); }
function shade(c,k){ const m = c.match(/^#(..)(..)(..)$/); if(!m) return c; const f = v => clamp(Math.round(k>0 ? v+(255-v)*k : v*(1+k)),0,255); return `rgb(${f(parseInt(m[1],16))},${f(parseInt(m[2],16))},${f(parseInt(m[3],16))})`; }

/* ================= 동물 그리기 ================= */
// (x,y) = 머리 가운데, s = 머리 크기
function drawPet(g, p, x, y, s, o={}){
  const t = o.t ?? performance.now()/1000, fur = p.fur, dark = shade(fur, fur === '#ffffff' ? -.12 : -.25), light = shade(fur, .45);
  const walk = o.walk ? Math.sin(t*12) : 0, flip = o.flip ? -1 : 1, sq = o.squash || 1;
  g.save(); g.translate(x, y); if(o.scaleY) g.scale(1, o.scaleY);
  const by = s*.66;   // 몸 위치
  // 꼬리
  g.save(); g.translate(-flip*s*.45, by + s*.05); g.scale(flip,1);
  g.strokeStyle = fur; g.fillStyle = fur; g.lineCap = 'round';
  if(p.kind === 'dog'){ const wag = Math.sin(t*(o.happy ? 16 : 5))*.5; g.rotate(-.6 + wag); g.lineWidth = s*.12; g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(-s*.18,-s*.12,-s*.12,-s*.32); g.stroke(); }
  if(p.kind === 'cat'){ const sw = Math.sin(t*2.5)*.25; g.lineWidth = s*.09; g.beginPath(); g.moveTo(0,0); g.bezierCurveTo(-s*.35,0,-s*.3+sw*s*.2,-s*.45,-s*.12+sw*s*.3,-s*.55); g.stroke(); }
  if(p.kind === 'rabbit'){ g.fillStyle = '#fff'; g.beginPath(); g.arc(-s*.02,-s*.02,s*.11,0,7); g.fill(); }
  g.restore();
  // 다리
  g.fillStyle = dark;
  const legs = [[-.3,1],[-.12,-1],[.14,1],[.32,-1]];
  for(const [lx,ph] of legs){ g.save(); g.translate(lx*s, by + s*.2); g.rotate(walk*.35*ph); g.beginPath(); g.roundRect(-s*.065, 0, s*.13, s*.26, s*.06); g.fill(); g.fillStyle = light; g.beginPath(); g.ellipse(0, s*.26, s*.08, s*.045, 0, 0, 7); g.fill(); g.fillStyle = dark; g.restore(); }
  // 몸
  g.fillStyle = fur; g.beginPath(); g.ellipse(0, by, s*.5, s*.33*sq, 0, 0, 7); g.fill();
  g.fillStyle = light; g.beginPath(); g.ellipse(flip*s*.05, by + s*.08, s*.28, s*.18, 0, 0, 7); g.fill();
  if(p.spots){ g.fillStyle = dark; for(const [sx,sy,r] of [[-.22,-.08,.09],[.18,-.12,.07],[.3,.06,.06]]){ g.beginPath(); g.arc(sx*s*flip, by+sy*s, r*s, 0, 7); g.fill(); } }
  if(p.kind === 'cat' && fur !== '#ffffff' && fur !== '#2b2b2b'){ g.strokeStyle = dark; g.lineWidth = s*.03; for(const sx of [-.25,-.12,.01]){ g.beginPath(); g.moveTo(sx*s*flip, by - s*.3); g.lineTo((sx+.03)*s*flip, by - s*.12); g.stroke(); } }
  // 목걸이 / 목도리
  if(o.collar !== false){ g.fillStyle = '#ff595e'; g.beginPath(); g.ellipse(0, s*.42, s*.24, s*.06, 0, 0, 7); g.fill(); g.fillStyle = '#ffd60a'; g.beginPath(); g.arc(0, s*.48, s*.045, 0, 7); g.fill(); }
  if(p.acc === 'scarf'){ g.fillStyle = '#e63946'; g.beginPath(); g.ellipse(0, s*.42, s*.3, s*.09, 0, 0, 7); g.fill(); g.beginPath(); g.roundRect(s*.08, s*.44, s*.1, s*.25, s*.03); g.fill(); g.fillStyle = '#fff'; g.fillRect(-s*.25, s*.41, s*.5, s*.025); }
  // 귀 (얼굴 뒤)
  const im = faces[p.face]; let fw = s, fh = s;
  if(im.naturalWidth){ const k = s/Math.max(im.naturalWidth, im.naturalHeight); fw = im.naturalWidth*k; fh = im.naturalHeight*k; }
  const top = -fh/2 + fh*.06;
  drawEars(g, p, s, top, fw, dark, light, t, o);
  // 얼굴
  if(im.naturalWidth){ g.save(); if(o.wet) g.filter = 'saturate(.9)'; g.drawImage(im, -fw/2, -fh/2, fw, fh); g.restore(); }
  // 수염 · 코
  if(p.kind !== 'dog'){ g.strokeStyle = 'rgba(60,40,30,.55)'; g.lineWidth = Math.max(1, s*.012); for(const d of [-1,1]) for(const k of [-1,0,1]){ g.beginPath(); g.moveTo(d*s*.16, s*.16 + k*s*.03); g.lineTo(d*s*.36, s*.12 + k*s*.06); g.stroke(); } }
  // 꾸미기
  drawAcc(g, p, s, top, fw, fh);
  // 진흙 / 거품 / 물기
  if(o.dirt) for(const d of o.dirt){ if(d.a <= .02) continue; g.globalAlpha = d.a*.85; g.fillStyle = '#6b4423'; g.beginPath(); g.arc(d.x*s, d.y*s, d.r*s, 0, 7); g.arc(d.x*s + d.r*s*.6, d.y*s + d.r*s*.3, d.r*s*.6, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  if(o.dirty && !o.dirt){ g.globalAlpha = o.dirty*.75; g.fillStyle = '#6b4423'; for(const [dx,dy,r] of [[-.25,.05,.08],[.2,.7,.1],[-.3,.75,.07],[.3,-.2,.06],[.05,.9,.08]]){ g.beginPath(); g.arc(dx*s, dy*s, r*s, 0, 7); g.fill(); } g.globalAlpha = 1; }
  g.restore();
}
function drawEars(g, p, s, top, fw, dark, light, t, o){
  const tw = Math.sin(t*3)*.06;
  if(p.ear === 'floppy'){ for(const d of [-1,1]){ g.save(); g.translate(d*fw*.42, top + s*.22); g.rotate(d*(.25 + (o.happy ? Math.sin(t*10)*.15 : tw))); g.fillStyle = dark; g.beginPath(); g.ellipse(0, s*.2, s*.13, s*.27, 0, 0, 7); g.fill(); g.restore(); } }
  else if(p.ear === 'pointy' || p.ear === 'cat'){ for(const d of [-1,1]){ g.save(); g.translate(d*fw*.3, top + s*.08); g.rotate(d*(.32 + tw)); g.fillStyle = p.ear === 'cat' ? p.fur : dark;
      g.beginPath(); g.moveTo(-s*.13, s*.06); g.lineTo(0, -s*.26); g.lineTo(s*.13, s*.06); g.closePath(); g.fill(); g.fillStyle = '#ffb3c6'; g.beginPath(); g.moveTo(-s*.07, s*.03); g.lineTo(0, -s*.16); g.lineTo(s*.07, s*.03); g.closePath(); g.fill(); g.restore(); } }
  else if(p.ear === 'bunny'){ for(const d of [-1,1]){ g.save(); g.translate(d*fw*.2, top + s*.05); g.rotate(d*(.15 + tw) + (o.happy ? Math.sin(t*8)*.1 : 0)); g.fillStyle = p.fur; g.beginPath(); g.ellipse(0, -s*.28, s*.1, s*.32, 0, 0, 7); g.fill();
      g.fillStyle = '#ffb3c6'; g.beginPath(); g.ellipse(0, -s*.26, s*.05, s*.24, 0, 0, 7); g.fill(); g.restore(); } }
}
function drawAcc(g, p, s, top, fw, fh){
  const a = p.acc; if(!a || a === 'scarf') return;
  g.save(); g.fillStyle = '#000'; g.textAlign = 'center'; g.textBaseline = 'middle';
  const E = { ribbon:['🎀', fw*.32, top + s*.12, s*.3], flower:['🌸', -fw*.3, top + s*.14, s*.28], hat:['👒', 0, top + s*.02, s*.62], glasses:['🕶️', 0, -fh/2 + fh*.47, s*.55],
              magic:['🎩', 0, top - s*.06, s*.55], cap:['🧢', 0, top + s*.04, s*.58], crown:['👑', 0, top - s*.04, s*.45] }[a];
  if(E){ g.font = `${E[3]}px sans-serif`; g.fillText(E[0], E[1], E[2]); }
  g.restore();
}
function petThumb(p, size=168){ const c = document.createElement('canvas'); c.width = size; c.height = size; const g = c.getContext('2d'); drawPet(g, p, size/2, size*.36, size*.46, {t:0}); return c; }

function heart(x, y, n=6, e='💖'){ for(let i=0;i<n;i++) fx.push({x, y, vx:rnd(-60,60), vy:rnd(-160,-80), life:1.2, e, s:rnd(18,30)}); }
function sparkle(x, y, n=10){ for(let i=0;i<n;i++) fx.push({x:x+rnd(-80,80), y:y+rnd(-80,80), vx:0, vy:rnd(-30,-10), life:rnd(.6,1.2), e:'✨', s:rnd(16,28)}); }
function drawFx(g, dt){ for(const f of fx){ f.x += f.vx*dt; f.y += f.vy*dt; f.life -= dt; g.globalAlpha = clamp(f.life*1.5, 0, 1); emo(g, f.e, f.x, f.y, f.s); } g.globalAlpha = 1; for(let i=fx.length-1;i>=0;i--) if(fx[i].life <= 0) fx.splice(i,1); }
function setBottom(btns){ const b = $('bottom'); b.innerHTML = ''; for(const x of btns){ const el = document.createElement('button'); el.className = 'bb' + (x.cls ? ' '+x.cls : ''); el.innerHTML = `<span class="e">${x.e}</span>${x.t}`; if(x.id) el.id = x.id; if(x.dis) el.disabled = true; el.onclick = e => { e.stopPropagation(); ac(); SND.click(); x.f(); }; b.appendChild(el); } }

/* ---- 공통 배경 조각 ---- */
function bgRoom(g, wall='#ffe8cc', floor='#d9a066'){
  g.fillStyle = wall; g.fillRect(0,0,W,H); g.fillStyle = 'rgba(255,255,255,.35)'; for(let x=0;x<W;x+=60) g.fillRect(x,0,26,H*.62);
  g.fillStyle = floor; g.fillRect(0,H*.62,W,H*.38); g.strokeStyle = 'rgba(0,0,0,.08)'; g.lineWidth = 3; for(let y=H*.62;y<H;y+=36){ g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke(); }
  g.fillStyle = '#c98b5a'; g.fillRect(0,H*.6,W,14);
}

<script>
/* ======================= 🏠 우리집 ======================= */

    this.ents = S.pets.map(p => ({p, x:rnd(120,880), y:rnd(360,450), tx:0, ty:0, st:'idle', t:rnd(0,3), flip:Math.random()<.5, pat:0}));

      {e:'🏪', t:'분양샵', f:() => go('shop')},
      {e:'🎾', t:'공 던지기', f:() => this.throwBall()},
      {e:'🛍️', t:'꾸미기 상점', f:openAccShop},
      {e:'📔', t:'앨범', f:openAlbum},
    ]);
    if(!S.pets.length) msg(S.rescued ? '집이 조용해요… 🏔️ 산에서 새 친구를 구해 올까요?' : '🐾 산에서 길 잃은 친구들이 기다려요! <b>🏔️ 구출하러 가기</b>를 눌러요', 0);
    else { const need = S.pets.find(p => NEEDS(p).length); if(need) msg(`${need.name}${NEEDS(need).includes('🍖') ? '가 배고파요 🍖' : NEEDS(need).includes('🛁') ? '를 씻겨 주세요 🛁' : '가 심심해요 🦮'} · 친구를 누르면 돌봐 줄 수 있어요`, 3500); else msg('친구를 톡 누르면 돌봐 줄 수 있어요 💕', 2500); }
  },
  throwBall(){ if(!this.ents.length) return msg('공놀이할 친구가 없어요!'); this.ball = {x:500, y:600, tx:rnd(140,860), ty:rnd(370,450), t:0}; SND.click(); },
  update(dt){
    for(const e of this.ents){
      e.t -= dt; e.pat = Math.max(0, e.pat - dt);
      if(this.ball && this.ball.t > .6){ e.tx = this.ball.tx + rnd(-40,40); e.ty = this.ball.ty + rnd(-10,10); e.st = 'walk'; e.fast = true; }
      else if(e.t <= 0){ if(Math.random() < .55){ e.st = 'walk'; e.tx = rnd(110,890); e.ty = rnd(360,452); e.fast = false; } else { e.st = e.p.happy < 25 || Math.random() < .3 ? 'sleep' : 'idle'; } e.t = rnd(2,5); }
      if(e.st === 'walk'){ const dx = e.tx-e.x, dy = e.ty-e.y, d = Math.hypot(dx,dy), sp = (e.fast ? 230 : 70)*dt; if(d < 4){ e.st = 'idle'; } else { e.x += dx/d*Math.min(d,sp); e.y += dy/d*Math.min(d,sp); e.flip = dx < 0; } }
    }
    if(this.ball){ const b = this.ball; b.t += dt; if(b.t > 3.2){ this.ball = null; for(const e of this.ents){ e.p.happy = clamp(e.p.happy + 6, 0, 100); heart(e.x, e.y-80, 2); } save(); } }
    this.decay += dt; if(this.decay > 20){ this.decay = 0; for(const p of S.pets){ p.hunger = clamp(p.hunger-2,0,100); p.clean = clamp(p.clean-1,0,100); p.happy = clamp(p.happy-1,0,100); } save(); if(sel) openPanel(sel); }
  },

    g.fillStyle = '#7ccf6e'; g.beginPath(); g.ellipse(215,250,150,50,0,Math.PI,0); g.fill(); g.fillStyle = '#fff'; g.fillRect(212,82,6,166); g.fillRect(102,162,226,6);

    // 소파, 방석, 밥그릇
    g.fillStyle = '#e07a5f'; g.beginPath(); g.roundRect(720,230,240,150,26); g.fill(); g.fillStyle = '#f2a48f'; g.beginPath(); g.roundRect(735,300,210,70,18); g.fill();
    g.fillStyle = '#ffd6e0'; g.beginPath(); g.ellipse(160,470,90,26,0,0,7); g.fill(); g.fillStyle = '#ffb3c6'; g.beginPath(); g.ellipse(160,466,70,18,0,0,7); g.fill();

  },

function askName(p, done){

    g.fillStyle = '#e8c9a8'; g.fillRect(0,H*.6,W,H*.4);
    g.fillStyle = '#ff8fab'; g.beginPath(); g.moveTo(0,0); for(let x=0;x<=W;x+=50) g.arc(x+25,40,25,Math.PI,0,true); g.lineTo(W,0); g.fill();
    g.fillStyle = '#fff'; g.beginPath(); g.roundRect(330,70,340,70,18); g.fill(); outlined(g,'🏪 멍냥이 분양샵',500,105,32,'#ff6b8a','#fff');
    // 문
    g.fillStyle = '#a5673f'; g.fillRect(30,170,150,220); g.fillStyle = '#bde0fe'; g.fillRect(50,190,110,90); emo(g,'🔔',105,160,30);
    // 카운터
    g.fillStyle = '#c08552'; g.fillRect(420,330,200,110); g.fillStyle = '#8b5a33'; g.fillRect(410,320,220,16); emo(g,'📋',470,300,40); emo(g,'🍬',580,300,36);
    // 진열장 친구들
    g.fillStyle = '#fff'; g.beginPath(); g.roundRect(660,180,320,260,20); g.fill(); g.strokeStyle = '#ffb3c6'; g.lineWidth = 6; g.stroke();
    outlined(g,'💕 가족을 기다려요',820,205,20,'#ff6b8a','#fff');
    const ps = S.pets.slice(0,8); ps.forEach((p,i) => { const col = i%4, row = Math.floor(i/4); drawPet(g, p, 700 + col*78, 260 + row*110, 46, {happy: this.cust && this.cust.pet === p}); });
    // 손님
    const c = this.cust;
    if(c){ const x = c.x, im = faces[c.face];
      g.fillStyle = c.letter ? '#3a86ff' : ['#ffb703','#8ecae6','#90be6d','#f28482'][c.face % 4];
      g.beginPath(); g.roundRect(x-40,380,80,110,26); g.fill(); g.fillStyle = '#3d5a99'; g.fillRect(x-30,480,24,60); g.fillRect(x+6,480,24,60);
      if(im.naturalWidth){ const k = 120/Math.max(im.naturalWidth, im.naturalHeight); g.drawImage(im, x - im.naturalWidth*k/2, 320 - im.naturalHeight*k/2, im.naturalWidth*k, im.naturalHeight*k); }
      if(c.letter) emo(g,'💌',x+50,420,40);
      if(this.st === 'talk' && !c.letter){ g.fillStyle = '#fff'; g.beginPath(); g.roundRect(x-20,200,200,56,18); g.fill(); g.fillStyle = '#6b3e26'; g.font = '900 17px sans-serif'; g.textAlign = 'center'; g.fillText(`${c.pet.name} 입양하고 싶어요!`, x+80, 230); }
    } else if(S.pets.length){ outlined(g,'🔔 손님 부르기를 눌러요!',300,470,24,'#fff'); }
  },
};

/* ======================= 루프 / 시작 ======================= */
let lastT = performance.now();
function loop(now){
  const dt = Math.min(.05, (now - lastT)/1000); lastT = now;
  const d = devicePixelRatio||1; ctx.setTransform(K*d,0,0,K*d,0,0); ctx.clearRect(0,0,W,H);
  if(scene){ scene.update && scene.update(dt); scene.draw(ctx, dt); drawFx(ctx, dt); }
  requestAnimationFrame(loop);
}
(function title(){
  const g = $('titleCv').getContext('2d'); const demo = [{kind:'dog', ear:'floppy', fur:'#c68642'}, {kind:'cat', ear:'cat', fur:'#f4a261'}, {kind:'rabbit', ear:'bunny', fur:'#ffffff'}, {kind:'dog', ear:'pointy', fur:'#f1d3a1'}];
  const pets = demo.map((d,i) => ({...d, face: (i*2 + Math.floor(Math.random()*FACE_SRCS.length)) % FACE_SRCS.length, spots:false, acc: ['ribbon',null,'flower',null][i]}));
  const tick = () => { if($('title').classList.contains('hidden')) return; g.clearRect(0,0,560,220); pets.forEach((p,i) => drawPet(g, p, 80 + i*133, 80 + Math.sin(performance.now()/300 + i)*6, 78, {happy:true})); requestAnimationFrame(tick); }; tick();
})();
$('startBtn').onclick = () => { ac(); SND.happy(); $('title').classList.add('hidden'); refreshTop(); go('home'); };
refreshTop(); requestAnimationFrame(loop);
window.__P = { S, go, get scene(){ return scene; }, SCENES, save, newPet, openPanel, openAlbum, openAccShop };
