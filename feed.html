<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>친구 밥 먹이기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;touch-action:none}
body{background:repeating-linear-gradient(45deg,#ffe9b8 0 28px,#ffdf9c 28px 56px);color:#4a2c12}
button{font-family:inherit;cursor:pointer;border:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center}
.scr.on{display:flex}
/* title */
#title{justify-content:center;gap:14px;padding:16px;text-align:center}
#title h1{font-size:clamp(34px,8vw,64px);color:#e8541c;text-shadow:3px 3px 0 #fff,6px 6px 0 #ffb347;line-height:1.1}
#title .sub{font-size:clamp(15px,3.6vw,22px)}
.faceRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:620px}
.faceRow img{width:clamp(54px,12vw,84px);height:clamp(54px,12vw,84px);border-radius:50%;background:#fff;border:4px solid #fff;box-shadow:0 3px 0 #d98c3a;object-fit:cover}
.faceRow img:nth-child(odd){animation:bob 1.2s ease-in-out infinite}
.faceRow img:nth-child(even){animation:bob 1.2s .6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
.big{font-size:clamp(20px,4.6vw,28px);padding:14px 26px;border-radius:20px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.25);min-width:260px}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.b1{background:#ff7a3d}.b2{background:#3db3ff}.b3{background:#8a6cff}
.big small{display:block;font-size:.55em;opacity:.9}
#best{font-size:16px}
/* game */
#game{justify-content:space-between}
#top{width:100%;display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.75);box-shadow:0 2px 0 #e9b46a;z-index:5}
#top .ib{background:#fff;border-radius:12px;padding:6px 10px;font-size:18px;box-shadow:0 3px 0 #d9a35a}
#picker{display:flex;gap:4px;overflow-x:auto;flex:1;scrollbar-width:none}
#picker img{width:44px;height:44px;border-radius:50%;background:#fff;border:3px solid #fff;flex:none;object-fit:cover;opacity:.75}
#picker img.sel{border-color:#ff7a3d;opacity:1;transform:scale(1.08)}
#hud{display:none;flex:1;justify-content:center;gap:12px;font-size:clamp(16px,4vw,22px);align-items:center}
#stage{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center}
#nameTag{position:absolute;top:6px;left:50%;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 16px;font-size:clamp(18px,4.5vw,26px);box-shadow:0 3px 0 #e0a050;white-space:nowrap;z-index:3}
#table{position:absolute;left:0;right:0;bottom:0;height:calc(50% - var(--fs)*.38);background:linear-gradient(#f3c98b,#e2a95e);border-top:8px solid #c98a45;z-index:2}
#plate{position:absolute;width:calc(var(--fs)*1.1);height:calc(var(--fs)*.26);top:calc(50% + var(--fs)*.3);left:50%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(#fff 50%,#e6e6e6 52%,#fff 66%,#d5d5d5);box-shadow:0 6px 0 rgba(0,0,0,.15);z-index:3;display:flex;align-items:center;justify-content:center;font-size:calc(var(--fs)*.09)}
#faceBox{position:relative;z-index:1;margin-top:calc(var(--fs)*-.08);width:var(--fs);height:var(--fs);transform-origin:50% 85%}
#faceWrap{width:100%;height:100%;transform-origin:50% 90%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
#face{width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(to right,transparent,#000 9%,#000 91%,transparent);pointer-events:none;-webkit-user-drag:none;transition:filter .3s}
#face.green{filter:hue-rotate(60deg) saturate(1.6) brightness(.95)}
#face.red{filter:sepia(.6) saturate(4) hue-rotate(-20deg) brightness(1.05)}
#face.blue{filter:hue-rotate(170deg) saturate(1.3)}
#face.gold{filter:saturate(1.5) brightness(1.1) drop-shadow(0 0 18px #ffe066)}
.chew{animation:chew .16s ease-in-out 4}
@keyframes chew{50%{transform:scale(1.08,.9)}}
.shake{animation:shake .09s linear 10}
@keyframes shake{25%{transform:translateX(-14px) rotate(-5deg)}75%{transform:translateX(14px) rotate(5deg)}}
.happy{animation:happy .45s ease-in-out 3}
@keyframes happy{50%{transform:translateY(-22px) rotate(6deg) scale(1.05)}}
.sour{animation:sour 1.1s ease-in-out}
@keyframes sour{20%,70%{transform:scale(.72,1.18) rotate(-3deg)}45%{transform:scale(.7,1.2) rotate(3deg)}}
.shiver{animation:shiver .05s linear 24}
@keyframes shiver{50%{transform:translateX(5px)}}
.burp{animation:burp 1s ease-out}
@keyframes burp{0%{transform:scale(1.4,1.25)}30%{transform:scale(1.55,1.1) rotate(-6deg)}60%{transform:scale(.9,1.12)}100%{transform:scale(1)}}
.spin{animation:spin .8s ease-in-out}
@keyframes spin{to{transform:rotate(720deg) scale(1)}}
#bubble{position:absolute;right:calc(50% - var(--fs)*.78);top:calc(50% - var(--fs)*.6);background:#fff;border-radius:24px;padding:8px 14px;font-size:clamp(16px,4vw,24px);box-shadow:0 4px 0 rgba(0,0,0,.12);max-width:46vw;opacity:0;transform:scale(.5);transition:.2s;z-index:4;text-align:center}
#bubble.on{opacity:1;transform:scale(1)}
#bubble:after{content:'';position:absolute;left:14px;bottom:-12px;border:12px solid transparent;border-top-color:#fff;border-bottom:0}
#want{position:absolute;left:calc(50% - var(--fs)*.85);top:calc(50% - var(--fs)*.55);width:calc(var(--fs)*.42);height:calc(var(--fs)*.36);background:#fff;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:calc(var(--fs)*.2);box-shadow:0 4px 0 rgba(0,0,0,.12);z-index:4}
#want:before,#want:after{content:'';position:absolute;background:#fff;border-radius:50%}
#want:before{width:22px;height:22px;right:-6px;bottom:-14px}
#want:after{width:12px;height:12px;right:-18px;bottom:-28px}
#wantT{position:absolute;left:8%;right:8%;bottom:6%;height:6px;border-radius:3px;background:#ff7a3d;transform-origin:left}
#meter{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:26px;height:min(42vh,260px);background:#fff;border-radius:14px;padding:3px;box-shadow:0 3px 0 #d9a35a;display:flex;flex-direction:column-reverse;z-index:3}
#meter i{display:block;border-radius:10px;background:linear-gradient(#ff5f6d,#ffc371);height:0%;transition:height .3s}
#meterL{position:absolute;left:4px;top:calc(50% + min(21vh,130px) + 8px);font-size:13px;z-index:3;background:#fff;border-radius:8px;padding:2px 4px}
#tray{width:100%;display:flex;gap:clamp(6px,2vw,14px);justify-content:center;padding:10px 8px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(#c97a3a,#a85d27);box-shadow:inset 0 6px 0 #e09550;flex-wrap:wrap;z-index:5}
.food{width:min(86px,calc((100vw - 70px)/6));height:min(86px,calc((100vw - 70px)/6));border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:min(52px,calc((100vw - 70px)/10));box-shadow:0 5px 0 rgba(0,0,0,.25);position:relative;touch-action:none;transition:transform .15s}
.food:active{transform:scale(.92)}
.food.gone{visibility:hidden}
.food .lb{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);font-size:11px;background:#4a2c12;color:#fff;border-radius:6px;padding:0 5px;white-space:nowrap}
.fly{position:fixed;z-index:20;pointer-events:none;font-size:clamp(40px,10vw,60px);line-height:1;transform:translate(-50%,-50%)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:15}
.pop{position:fixed;z-index:18;pointer-events:none;font-size:clamp(26px,7vw,48px);color:#fff;-webkit-text-stroke:2px #4a2c12;paint-order:stroke;white-space:nowrap;animation:popUp 1.2s ease-out forwards;transform:translate(-50%,-50%)}
@keyframes popUp{0%{transform:translate(-50%,-30%) scale(.4)}20%{transform:translate(-50%,-60%) scale(1.15)}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
#hearts{letter-spacing:2px}
#over{justify-content:center;gap:12px;background:rgba(255,236,190,.97);z-index:30;text-align:center;padding:16px}
#over h2{font-size:clamp(28px,7vw,48px);color:#e8541c}
#king{display:flex;gap:10px;align-items:center;justify-content:center}
#king img{width:clamp(110px,30vw,170px);height:clamp(110px,30vw,170px);border-radius:50%;background:#fff;border:6px solid #ffd23d;object-fit:cover}
#overS{font-size:clamp(18px,4.5vw,26px)}
#fever{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:0;transition:.4s;background:radial-gradient(transparent 40%,rgba(255,80,160,.35));}
#fever.on{opacity:1;animation:fv .5s infinite alternate}
@keyframes fv{to{filter:hue-rotate(90deg)}}
.tip{font-size:14px;opacity:.8}
.b4{background:#2fbf71}
.dish{position:relative;display:inline-block;line-height:1}
.dish i{position:absolute;font-size:.52em;font-style:normal;line-height:1}
.dish .t0{left:-.3em;top:-.25em;transform:rotate(-20deg)}.dish .t1{right:-.3em;top:-.25em;transform:rotate(18deg)}.dish .t2{right:-.25em;bottom:-.2em;transform:rotate(-8deg)}
.food.isDish{background:radial-gradient(#fff 55%,#ffe27a);box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 4px #ffcf33;animation:dg 1s ease-in-out infinite alternate}
@keyframes dg{to{box-shadow:0 5px 0 rgba(0,0,0,.25),0 0 0 7px #ff8a3d}}
#kitchen{position:fixed;inset:0;z-index:40;background:rgba(60,30,10,.55);display:none;align-items:center;justify-content:center;padding:10px}
#kitchen.on{display:flex}
#kp{background:#fff8e8;border-radius:24px;width:min(560px,100%);max-height:100%;overflow:auto;padding:14px;box-shadow:0 8px 0 rgba(0,0,0,.25);text-align:center;position:relative}
#kp h3{font-size:clamp(22px,5.5vw,30px);color:#e8541c}
#kClose{position:absolute;right:10px;top:10px;background:#fff;border-radius:12px;padding:4px 10px;font-size:20px;box-shadow:0 3px 0 #d9a35a}
#potRow{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.slot{width:62px;height:62px;border-radius:16px;border:3px dashed #d9a35a;background:#fff;font-size:38px;display:flex;align-items:center;justify-content:center}
#pot{font-size:64px;line-height:1;position:relative}
#pot.cooking{animation:shake .09s linear infinite}
#pot .sm{position:absolute;left:50%;top:-10px;font-size:26px;animation:smk 1s linear infinite;opacity:0}
@keyframes smk{0%{transform:translate(-50%,0) scale(.6);opacity:.9}100%{transform:translate(-50%,-50px) scale(1.4);opacity:0}}
.ing{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 8px}
.ing button{width:50px;height:50px;border-radius:14px;background:#fff;font-size:30px;box-shadow:0 3px 0 #e0b070;position:relative}
.ing button:active{transform:translateY(2px)}
.ingT{font-size:15px;margin-top:4px}
.kb{font-size:18px;padding:10px 16px;border-radius:14px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);margin:3px}
#kRes{display:none;flex-direction:column;align-items:center;gap:6px;padding:6px}
#kRes .dish{font-size:110px;margin:16px 0 6px;animation:happy .5s ease-in-out 2}
#kName{font-size:clamp(22px,6vw,32px);color:#4a2c12;background:#ffe27a;border-radius:14px;padding:4px 14px}
#kSmell{font-size:18px}
#dex{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:13px;margin-top:6px}
#dex span{background:#fff;border-radius:10px;padding:2px 8px;box-shadow:0 2px 0 #e0b070}
@media (max-width:600px){#meter{width:18px;left:4px}#meterL{font-size:11px}#bubble{max-width:58vw}}
</style></head><body>
<div id="fever"></div>
<div id="title" class="scr on">
  <h1>🍽️ 친구 밥 먹이기<br>냠냠 대작전!</h1>
  <div class="sub">맛있는 걸 주면 😋 행복! 이상한 걸 주면 🤢 으웩!</div>
  <div class="faceRow" id="tFaces"></div>
  <button class="big b1" id="bFree">🥄 마음대로 먹이기<small>음식을 끌어서 입에 쏙!</small></button>
  <button class="big b2" id="bOrder">⏱️ 주문 먹방 챌린지<small>친구가 먹고 싶은 걸 빨리 주자!</small></button>
  <button class="big b4" id="bLab">🧪 괴식 연구소<small>재료를 섞어 이상한 요리를 만들어 먹이자!</small></button>
  <button class="big b3" id="bPrank">😈 장난 모드<small>맛없는 것만 잔뜩! 몇 번 웩 하나?</small></button>
  <div id="best"></div>
  <div class="tip">음식을 톡 누르면 슝~ 날아가요. 끌어다 입에 넣어도 돼요!</div>
</div>
<div id="game" class="scr">
  <div id="top">
    <button class="ib" id="bHome">🏠</button>
    <div id="picker"></div>
    <div id="hud"><span id="hearts">❤️❤️❤️</span><span>⭐ <b id="score">0</b></span><span>⏱️ <b id="time">60</b></span><span id="combo"></span></div>
    <button class="ib" id="bCook">🍳 괴식</button>
    <button class="ib" id="bSnd">🔊</button>
  </div>
  <div id="stage">
    <div id="nameTag"></div>
    <div id="table"></div><div id="plate">🥄 🍴</div>
    <div id="faceBox"><div id="faceWrap"><img id="face" alt=""></div></div>
    <div id="bubble"></div>
    <div id="want"><span id="wantE"></span><i id="wantT"></i></div>
    <div id="meter"><i id="meterI"></i></div><div id="meterL">배부름</div>
  </div>
  <div id="tray"></div>
</div>
<div id="kitchen"><div id="kp">
  <button id="kClose">✖</button>
  <h3>🧪 괴식 연구소</h3>
  <div id="kMake">
   <div class="ingT">재료를 2~3개 골라 냄비에 넣어요!</div>
   <div id="potRow"><div class="slot" id="s0"></div><div class="slot" id="s1"></div><div class="slot" id="s2"></div><div id="pot">🍲</div></div>
   <div class="ingT">😋 맛있는 재료</div><div class="ing" id="ingY"></div>
   <div class="ingT">🤢 이상한 재료</div><div class="ing" id="ingB"></div>
   <button class="kb b1" id="kCook">🔥 요리하기!</button><button class="kb b3" id="kRand">🎲 아무거나</button><button class="kb" style="background:#999" id="kClear">🧹 비우기</button>
   <div id="dex"></div>
  </div>
  <div id="kRes">
   <div id="kDish"></div>
   <div id="kName"></div>
   <div id="kSmell"></div>
   <div><button class="kb b1" id="kFeed">🥄 친구한테 먹이기!</button><button class="kb b2" id="kAgain">🍳 하나 더 만들기</button></div>
  </div>
 </div></div>
<div id="over" class="scr">
  <h2 id="overH">끝!</h2>
  <div id="king"></div>
  <div id="overS"></div>
  <button class="big b1" id="bAgain">🔁 다시 하기</button>
  <button class="big b2" id="bBack">🏠 처음으로</button>
</div>
<canvas id="fx"></canvas>

function makeDish(items){
 const pre=pick(['','','','특제 ','전설의 ','할머니표 ','초특급 ','우리반 ','수상한 ']);
 let name,be,tops;
 if(items.every(x=>x===items[0])){const a=items[0];name=`${a.n} ${items.length}단 콤보`;be=a.e;tops=items.slice(1).map(x=>x.e)}
 else{const base=[...items].reverse().find(x=>x.base);
  if(base){const rest=items.slice();rest.splice(rest.lastIndexOf(base),1);be=base.e;tops=rest.map(x=>x.e);
   name=rest.length===1?pick([`${rest[0].n} ${base.n}`,`${rest[0].n} 듬뿍 ${base.n}`,`${rest[0].n} 맛 ${base.n}`,`${rest[0].n} 토핑 ${base.n}`]):pick([`${rest[0].n}+${rest[1].n} ${base.n}`,`${rest[0].n} ${rest[1].n} 범벅 ${base.n}`]);}
  else{const fm=pick(FORMS);be=fm[1];tops=items.map(x=>x.e);name=items.map(x=>x.n).join(' ')+' '+fm[0]}}
 const nb=items.filter(x=>x.bad).length,ny=items.length-nb;let out;
 if(nb===0)out=Math.random()<.8?'great':'twistBad';
 else if(ny===0)out='terrible';
 else{const r=Math.random();out=r<.4?'twistBad':r<.65?'twistGood':'terrible'}
 const fxs=[...new Set(items.filter(x=>x.bad).map(x=>x.fx))];
 return{dish:1,n:pre+name,e:be,be,tops,items,nb,out,fxs:fxs.length?fxs:['spit'],bad:0}}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='sine',v=.2,f2=null,t0=0){const a=ac();if(!a||!SND)return;const t=a.currentTime+t0,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,v=.3,fq=1200,t0=0,q=1){const a=ac();if(!a||!SND)return;const t=a.currentTime+t0,b=a.createBuffer(1,a.sampleRate*d|0,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=Math.random()*2-1;const s=a.createBufferSource();s.buffer=b;const fl=a.createBiquadFilter();fl.type='bandpass';fl.frequency.value=fq;fl.Q.value=q;const g=a.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(fl).connect(g).connect(a.destination);s.start(t)}

  $('overH').textContent=G.mode==='order'?'🏆 오늘의 먹방왕!':'😈 오늘의 웩웩왕!';
  $('king').innerHTML=`<img src="${G.mode==='order'?K.g:pick(K.b)}"><img src="${K.m}" style="width:clamp(70px,18vw,100px);height:clamp(70px,18vw,100px)">`;
  $('overS').innerHTML=`<b>${NM(K)}</b> (${mx}번 먹음)<br>점수 <b>${G.score}</b>${nb?' 🎉 신기록!':' · 최고 '+b}`;
  say(G.mode==='order'?NM(K)+' 먹방왕!':NM(K)+' 웩웩왕!',1.3);confetti({})},900)}

// ---------- ui ----------
$('tFaces').innerHTML=KIDS.map(k=>`<img src="${k.g}">`).join('');
$('picker').innerHTML=KIDS.map((k,i)=>`<img src="${k.m}" title="${NM(k)}">`).join('');
[...$('picker').children].forEach((im,i)=>im.onclick=()=>{if(i!==G.kid)setKid(i)});
$('bFree').onclick=()=>{ac();start('free')};
$('bOrder').onclick=()=>{ac();start('order')};
$('bPrank').onclick=()=>{ac();start('prank')};
$('bLab').onclick=()=>{ac();start('free');setTimeout(openKitchen,500)};
$('bCook').onclick=()=>{ac();openKitchen()};
$('bHome').onclick=()=>{G.run=false;G.mode=null;$('fever').classList.remove('on');$('game').classList.remove('on');$('title').classList.add('on');showBest()};
$('bAgain').onclick=()=>start(G.mode);
$('bBack').onclick=()=>{$('over').classList.remove('on');$('title').classList.add('on');showBest()};
function sndBtn(){$('bSnd').textContent=SND?'🔊':'🔇'}sndBtn();
$('bSnd').onclick=()=>{SND=!SND;try{localStorage.setItem('feedSnd',SND?'1':'0')}catch(e){}sndBtn();if(!SND)try{speechSynthesis.cancel()}catch(e){}};
// tap face = tickle
$('faceBox').addEventListener('pointerdown',()=>{if(lockT>performance.now())return;setFace('g');anim($('faceBox'),'happy',900);S.boing();bubble(pick(['간지러워~ 히히','밥 줘 밥!','헤헤헤','배고파!']),1100);clearFace(1000)});
function showBest(){let a=0,b=0;try{a=+localStorage.getItem('feedBest_order')||0;b=+localStorage.getItem('feedBest_prank')||0}catch(e){}$('best').textContent=(a||b)?`🏆 먹방 최고 ${a} · 😈 장난 최고 ${b}`:''}
showBest();rs();
// ---------- 괴식 연구소 ----------
let KOPEN=false,POT=[],CUR=null,DEX=[];try{DEX=JSON.parse(localStorage.getItem('feedDex')||'[]')}catch(e){}
const OUTK={great:'😋 대성공',terrible:'🤮 대참사',twistBad:'😋→🤮 반전',twistGood:'🤢→😋 반전'};
function ingBtns(id,arr){$(id).innerHTML='';arr.forEach(f=>{const b=document.createElement('button');b.textContent=f.e;b.title=f.n;b.onclick=()=>{if(POT.length>=3){S.bad();return}POT.push(f);S.tick();tone(300+POT.length*120,.12,'sine',.15);drawPot()};$(id).appendChild(b)})}
function drawPot(){for(let i=0;i<3;i++)$('s'+i).textContent=POT[i]?POT[i].e:''}
function drawDex(){$('dex').innerHTML=DEX.length?`<div style="width:100%">📖 괴식 도감 ${DEX.length}개</div>`+DEX.slice(-12).reverse().map(d=>`<span>${d.e} ${d.n} ${d.o?OUTK[d.o].split(' ')[0]:'❓'}</span>`).join(''):''}
function openKitchen(){if(!G.mode||G.mode==='order')return;KOPEN=true;POT=[];drawPot();ingBtns('ingY',YUM.filter(f=>!f.rare));ingBtns('ingB',YUCK);
 $('kMake').style.display='';$('kRes').style.display='none';drawDex();$('kitchen').classList.add('on')}
function closeKitchen(){KOPEN=false;$('kitchen').classList.remove('on')}
$('kClose').onclick=closeKitchen;
$('kClear').onclick=()=>{POT=[];drawPot()};
$('kRand').onclick=()=>{POT=[];const n=Math.random()<.5?2:3;const all=[...YUM.filter(f=>!f.rare),...YUCK];for(let i=0;i<n;i++)POT.push(pick(all));drawPot();S.boing()};
$('kCook').onclick=()=>{if(POT.length<2){bubbleK('재료를 2개 이상 넣어줘!');return}
 const pot=$('pot');pot.classList.add('cooking');pot.innerHTML='🍲<span class="sm">💨</span><span class="sm" style="animation-delay:.3s">♨️</span><span class="sm" style="animation-delay:.6s">💨</span>';
 for(let i=0;i<8;i++)tone(rnd(200,500),.1,'sine',.15,rnd(600,900),i*.17);noise(1.4,.15,400,0,.5);
 for(let i=0;i<3;i++)$('s'+i).textContent=POT[i]?'🌀':'';
 $('kCook').disabled=true;
 setTimeout(()=>{pot.classList.remove('cooking');pot.textContent='🍲';$('kCook').disabled=false;
  CUR=makeDish(POT.slice());S.party();
  $('kDish').innerHTML=foodHTML(CUR);$('kName').textContent=CUR.n;
  $('kSmell').textContent='냄새: '+(CUR.nb?'🤢'.repeat(CUR.nb)+' 수상해…':'😋 고소한 냄새!')+'  맛: ???';
  $('kMake').style.display='none';$('kRes').style.display='flex';say(CUR.n+' 완성!',1.3);
  DEX.push({n:CUR.n,e:CUR.items.map(x=>x.e).join(''),o:null});if(DEX.length>60)DEX.shift();CUR.dexI=DEX.length-1;saveDex()},1500)};
function bubbleK(t){const h=$('kp').querySelector('.ingT');const o=h.textContent;h.textContent='⚠️ '+t;S.bad();setTimeout(()=>h.textContent=o,1200)}
function saveDex(){try{localStorage.setItem('feedDex',JSON.stringify(DEX))}catch(e){}}
$('kAgain').onclick=()=>{POT=[];drawPot();$('kMake').style.display='';$('kRes').style.display='none';drawDex()};
$('kFeed').onclick=()=>{if(!CUR)return;const slot=Math.random()*TRAY.length|0;TRAY[slot]=CUR;drawTray();closeKitchen();
 setTimeout(()=>{bubble(pick(['그게… 뭐야?','나 그거 먹어야 돼…?','냄새가 좀 이상한데…','오 요리사님이다!']),1800);anim($('faceBox'),'shiver',600)},200)};
function eatDish(f,m){const o=f.out;
 const dx=DEX.find((d,i)=>i===f.dexI);if(dx&&!dx.o){dx.o=o;saveDex()}
 const bad=(l)=>({e:f.be,fx:f.fxs[0],fxs:f.fxs,l,dishBonus:f.nb*60});
 if(o==='great'){yummy({fx:'party',l:['천재 요리야! 셰프님 최고!','이 조합 완전 대박!','한 그릇 더 주세요!']},m);pop('🏆 '+f.n+' 대성공!',m.x,m.y-m.w*.75,'#ffe066')}
 else if(o==='terrible'){yucky(bad(['이게 음식이야?!','으아악 괴식이다!','내 혀가 도망갔어!','누가 만든 거야!']),m);pop('💀 '+f.n+' 대참사!',m.x,m.y-m.w*.75,'#8be04e')}
 else if(o==='twistBad'){setFace('g');anim($('faceBox'),'happy',900);bubble('음~ 생각보다 맛있…',1300);say('음~ 생각보다 맛있',1.4);S.good();
  setTimeout(()=>{yucky(bad(['…지 않아! 으웩!!','아니야 아니야 웩!','뒤늦게 맛이 와! 으악!']),m);pop('반전! 🤮',m.x,m.y-m.w*.75,'#8be04e')},1500)}
 else{setFace('b');anim($('faceBox'),'shake',900);bubble('으… 이게 뭐야…',1300);say('으 이게 뭐야',1);S.bad();
  setTimeout(()=>{yummy({l:['어? 근데 맛있잖아?!','의외로 꿀맛인데?!','이거 완전 신메뉴야!']},m);pop('반전! 😋',m.x,m.y-m.w*.75,'#ffe066')},1500)}}
window.__G=G;window.__mk=makeDish;window.__YUM=YUM;window.__YUCKL=YUCK;window.__YK=()=>YUCK.find(f=>f.fx==='fire');window.__eat=eat;window.__TRAY=()=>TRAY;
</script></body></html>
